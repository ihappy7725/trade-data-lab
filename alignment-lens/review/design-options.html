<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Alignment Lens · 디자인 비교 시안 · 데이터 없음</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9edf0;color:#18262d;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6}button,input{font:inherit}input::placeholder{color:var(--muted);opacity:1}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #9c4d0f;outline-offset:3px}.review-head{padding:28px 32px 22px;max-width:1500px;margin:auto}.review-head h1{font-size:24px;letter-spacing:-.6px;margin:0 0 6px}.review-head p{margin:0;color:#47545c;font-size:14px}.review-controls{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}.review-controls button{background:#fff;border:1px solid #74818b;border-radius:4px;padding:7px 14px;color:#18262d}.options{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;padding:0 32px 32px;max-width:1500px;margin:auto}.option{min-width:0}.caption{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:10px}.caption h2{font-size:18px;margin:0}.caption span{font-size:12px;color:#47545c}.canvas{--bg:#fbfaf7;--surface:#fff;--text:#1d2c32;--muted:#52616a;--line:#cbd1d1;--blue:#006b98;--orange:#ac4d10;--tint:#f0f3f2;background:var(--bg);color:var(--text);border:1px solid var(--line);min-width:0;min-height:1100px}.canvas.b{--bg:#f6f8fb;--surface:#fff;--text:#182a3e;--muted:#4e6176;--line:#c9d3e0;--blue:#005eaa;--orange:#a64b12;--tint:#e9f0f8}.canvas.dark{--bg:#142128;--surface:#1b2c35;--text:#ecf2f4;--muted:#b3c4cf;--line:#526773;--blue:#78c7eb;--orange:#ffbc83;--tint:#223942}.canvas.b.dark{--bg:#142033;--surface:#1c2e44;--text:#eef3fa;--muted:#bdccdf;--line:#526b87;--blue:#86c6ff;--orange:#ffc08c;--tint:#233b57}.nav{padding:22px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:18px;font-weight:750;letter-spacing:-.6px;white-space:nowrap}.brand svg{vertical-align:middle;margin-right:7px;color:var(--blue)}.nav-links{display:flex;gap:13px;font-size:12px;color:var(--muted);flex-wrap:wrap}.intro{padding:40px 28px 30px}.eyebrow{color:var(--blue);font-size:11px;font-weight:750;letter-spacing:1.4px;text-transform:uppercase}.intro h3{font-size:32px;line-height:1.4;letter-spacing:-1.4px;margin:12px 0 16px;font-weight:650;word-break:keep-all}.a .intro h3{font-family:"AppleMyungjo","Batang",serif}.intro p{font-size:14px;color:var(--muted);margin:0;word-break:keep-all}.picker{padding:0 28px 30px}.pair-fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.field label{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:7px}.field input{width:100%;min-width:0;background:var(--surface);color:var(--text);border:1px solid var(--line);padding:12px;border-radius:2px;font-size:14px}.go{background:var(--blue);color:var(--bg);border:0;padding:12px 16px;font-size:14px;font-weight:700;width:100%;margin-top:12px;border-radius:2px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}.chips button{font-size:11px;border:1px solid var(--line);padding:4px 8px;background:var(--surface);color:var(--muted);border-radius:20px}.source-line{font-size:10px;color:var(--muted);border-top:1px solid var(--line);margin-top:22px;padding-top:12px;overflow-wrap:anywhere}.pair-preview{margin:0 28px 28px;padding-top:24px;border-top:1px solid var(--line)}.pair-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}.pair-title h4{font-size:18px;letter-spacing:-.5px;margin:0}.stage{font-size:10px;color:var(--muted);border:1px solid var(--line);padding:2px 6px;white-space:nowrap}.plot-label{font-size:12px;margin:18px 0 8px;display:flex;gap:7px;align-items:center;font-weight:650}.swatch{display:inline-block;width:17px;height:3px;background:var(--blue)}.swatch.orange{background:var(--orange)}.plot{height:110px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;place-items:center;background:var(--surface);color:var(--muted);font-size:11px;padding:10px;text-align:center}.plot-note{font-size:10px;color:var(--muted);margin:6px 0 0}.caution{font-size:11px;border-left:3px solid var(--orange);padding-left:10px;margin:18px 0;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.card{border-top:1px solid var(--line);padding-top:10px}.card strong{display:block;font-size:12px;margin-bottom:6px}.card p{font-size:10px;color:var(--muted);margin:0;word-break:keep-all}.b .intro{padding-top:30px}.b .intro h3{font-size:30px;font-weight:780;letter-spacing:-1.1px}.b .picker{padding-top:4px}.b .pair-fields{gap:0;border:1px solid var(--line);background:var(--surface)}.b .field{padding:12px}.b .field+ .field{border-left:1px solid var(--line)}.b .field input{border:0;background:transparent;padding:0;border-radius:0}.b .go{border-radius:0}.b .pair-preview{background:var(--surface);border:1px solid var(--line);padding:18px;margin-top:0}.b .plot{background:var(--bg)}.b .plot-label{font-family:inherit;text-transform:uppercase;letter-spacing:.2px}.b .cards{gap:0;border:1px solid var(--line);background:var(--tint)}.b .card{padding:10px 8px;border:0}.b .card+.card{border-left:1px solid var(--line)}.foot{font-size:11px;color:var(--muted);padding:0 28px 24px}.mobile .options{grid-template-columns:375px;justify-content:center}.mobile .canvas{min-height:0}.mobile .caption{flex-wrap:wrap}.mobile .nav{padding:17px 20px}.mobile .nav-links{gap:8px;font-size:10px}.mobile .brand{font-size:15px}.mobile .intro{padding:28px 20px 22px}.mobile .intro h3{font-size:28px}.mobile .picker{padding:0 20px 24px}.mobile .pair-preview{margin:0 20px 24px}.mobile .b .pair-preview{padding:14px}.mobile .pair-title{flex-wrap:wrap}.mobile .cards{grid-template-columns:1fr}.mobile .b .card+.card{border-left:0;border-top:1px solid var(--line)}.mobile .card p{font-size:12px}.mobile .card strong{font-size:13px}.mobile .plot{height:125px}.mobile .plot-note,.mobile .source-line{font-size:11px}.mobile .plot-label,.mobile .caution{font-size:12px}.mobile .nav{flex-wrap:wrap}.mobile .nav-links{font-size:12px}
@media(max-width:850px){.options{grid-template-columns:minmax(0,1fr);padding:0 14px 24px;gap:28px}.review-head{padding:22px 16px}.canvas{min-height:0}.nav{padding:18px 20px}.intro{padding:30px 20px 24px}.picker{padding:0 20px 28px}.pair-preview{margin:0 20px 24px}.caption{flex-wrap:wrap}.cards{grid-template-columns:1fr}.card p{font-size:12px}.card strong{font-size:13px}.b .card+.card{border-left:0;border-top:1px solid var(--line)}.source-line,.plot-note{font-size:11px}.plot-label,.caution{font-size:12px}.brand{font-size:16px}.nav{flex-wrap:wrap}.nav-links{font-size:12px}.intro h3,.b .intro h3{font-size:28px}.mobile .options{grid-template-columns:minmax(0,375px)}}
</style>
</head>
<body>
<header class="review-head">
<h1>Alignment Lens · 디자인 방향 비교</h1>
<p>구조 시안 · 데이터 없음. 같은 구성의 글자·배치·색을 비교합니다. 임시 통계값과 추세선은 넣지 않았습니다.</p>
<div class="review-controls"><button id="theme" type="button">다크로 비교</button><button id="mobile" type="button">휴대폰 폭으로 비교</button></div>
</header>
<main class="options" id="options"></main>
<script>
const icon='<svg width="17" height="17" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.5"/><path d="m12 12 5 5M8 4v8M4 8h8" stroke="currentColor" stroke-width="1.5"/></svg>';
function option(key,title,description){return `<section class="option"><div class="caption"><h2>${key} · ${title}</h2><span>${description}</span></div><article class="canvas ${key.toLowerCase()}"><div class="nav"><div class="brand">${icon}Alignment Lens</div><div class="nav-links"><span>방법</span><span>출처</span><span>한 / EN</span><span>◐</span></div></div><div class="intro"><div class="eyebrow">Diplomacy &amp; trade</div><h3>가까운 나라끼리<br>더 많이 교역하게 되었나?</h3><p>유엔총회 투표로 잰 외교 거리와 두 나라의 교역 비중을 같은 시간축에서 살펴봅니다.</p></div><div class="picker"><div class="pair-fields"><div class="field"><label for="${key}-a">나라 A</label><input id="${key}-a" placeholder="이름 또는 ISO3" aria-label="나라 A 시안 입력"></div><div class="field"><label for="${key}-b">나라 B</label><input id="${key}-b" placeholder="이름 또는 ISO3" aria-label="나라 B 시안 입력"></div></div><button class="go" type="button">나란히 보기 ↓</button><div class="chips"><button type="button" data-a="한국" data-b="중국">한국–중국</button><button type="button" data-a="한국" data-b="미국">한국–미국</button><button type="button" data-a="독일" data-b="러시아">독일–러시아</button></div><div class="source-line">UNGA 이념 위치 점수 · Dataverse 39판 내 Jun2024 파일<br>BACI, CEPII · HS92 V202601 · 원자료 확인 2026-11-17</div></div><div class="pair-preview"><div class="pair-title"><h4>두 나라의 변화 나란히 보기</h4><span class="stage">쌍 화면 배치 시안</span></div><div class="plot-label"><span class="swatch"></span>외교 거리 · 유엔총회 투표 기준</div><div class="plot">데이터를 연결하면 실제 관측값만 표시합니다.</div><div class="plot-note">출처·사용 판·해당 연도를 그래프 바로 아래에 표시</div><div class="plot-label"><span class="swatch orange"></span>교역 비중 · 두 방향을 함께</div><div class="plot">두 그래프는 같은 연도축을 사용합니다.</div><p class="caution">두 선은 같은 시기의 변화를 보여 줄 뿐, 원인을 뜻하지 않습니다.</p><div class="cards"><div class="card"><strong>사실</strong><p>계산한 값과 비교한 연도를 표시합니다.</p></div><div class="card"><strong>해석</strong><p>검수된 해석이 있는 쌍만 표시합니다.</p></div><div class="card"><strong>불확실</strong><p>자료의 범위와 빠진 기록을 설명합니다.</p></div></div></div><div class="foot">이 시안은 디자인 비교용입니다. 실제 데이터 화면이 아닙니다.</div></article></section>`}
document.querySelector('#options').innerHTML=option('A','읽는 보고서','여백 · 명조 제목 · 따뜻한 바탕')+option('B','탐색하는 도구','정렬된 칸 · 고딕 제목 · 차가운 바탕');
document.querySelector('#theme').onclick=e=>{document.querySelectorAll('.canvas').forEach(x=>x.classList.toggle('dark'));e.target.textContent=document.querySelector('.canvas.dark')?'라이트로 비교':'다크로 비교'};
document.querySelector('#mobile').onclick=e=>{document.body.classList.toggle('mobile');e.target.textContent=document.body.classList.contains('mobile')?'넓은 화면으로 비교':'휴대폰 폭으로 비교'};
document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{const panel=b.closest('.canvas');panel.querySelectorAll('input')[0].value=b.dataset.a;panel.querySelectorAll('input')[1].value=b.dataset.b});
document.querySelectorAll('.go').forEach(b=>b.onclick=()=>b.closest('.canvas').querySelector('.pair-preview').scrollIntoView({behavior:'smooth',block:'center'}));
</script>
</body>
</html>
