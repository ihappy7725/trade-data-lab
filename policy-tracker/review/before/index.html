<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Policy Trade Tracker (before 비교용)</title>
<!-- 비교용 before: 세부 요구 없이 "정책 발표 → 무역 변화 추적기" 아이디어만으로 단순하게 만든 첫 결과물을 재현한 화면.
     DESIGN.md · PLAN.md 규칙을 적용하지 않은 상태. 배포하지 않는다. -->
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f6fa;color:#333}
header{background:linear-gradient(135deg,#6a5af9,#3b82f6);color:#fff;text-align:center;padding:60px 20px}
header h1{margin:0 0 10px;font-size:40px}
header p{margin:0;font-size:18px;opacity:.9}
main{max-width:960px;margin:0 auto;padding:40px 20px}
.box{background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:24px;margin-bottom:24px}
label{font-weight:bold;margin-right:8px}
select{padding:8px;font-size:15px}
svg{width:100%;height:260px;display:block;margin-top:16px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:24px;text-align:center}
.card .ic{font-size:32px}
.card h3{margin:10px 0 6px}
.card p{margin:0;color:#666;font-size:14px}
footer{text-align:center;color:#999;padding:30px;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>Policy Trade Tracker</h1>
  <p>정책 발표 전후의 무역 변화를 추적하세요!</p>
</header>
<main>
  <div class="box">
    <label for="sel">정책 선택</label>
    <select id="sel"></select>
    <svg id="ch" viewBox="0 0 900 260" preserveAspectRatio="none"></svg>
  </div>
  <div class="cards">
    <div class="card"><div class="ic">📊</div><h3>데이터 분석</h3><p>정책 전후 무역 데이터를 분석합니다.</p></div>
    <div class="card"><div class="ic">📈</div><h3>시각화</h3><p>그래프로 쉽게 확인하세요.</p></div>
    <div class="card"><div class="ic">🌍</div><h3>글로벌</h3><p>전 세계 정책을 다룹니다.</p></div>
  </div>
</main>
<footer>© 2026 Policy Trade Tracker</footer>
<script src="../../data/policies.js"></script>
<script>
const P=(window.POLICYLINE_DATA||{policies:[]}).policies;
const sel=document.getElementById("sel");
sel.innerHTML=P.map((p,i)=>`<option value="${i}">${p.title.ko}</option>`).join("");
function draw(){const p=P[sel.value];if(!p)return;const v=p.series.map(x=>x.v||0),max=Math.max(1,...v);
 document.getElementById("ch").innerHTML=`<polyline points="${v.map((y,i)=>(i*900/24)+','+(250-y/max*230)).join(' ')}" fill="none" stroke="#6a5af9" stroke-width="3"/>`}
sel.onchange=draw;draw();
</script>
</body>
</html>
