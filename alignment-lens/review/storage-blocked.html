function niceMax(value){if(!(value>0))return 1;const power=10**Math.floor(Math.log10(value));const scaled=value/power;return ([1,2,5,10].find(x=>x>=scaled)||10)*power}
function pathFor(values,scopes,x,y){let result='',previous=false,previousScope;values.forEach((v,i)=>{if(v===null||!Number.isFinite(v)){previous=false;return}const start=!previous||scopes[i]!==previousScope;result+=`${start?'M':'L'}${x(i).toFixed(2)},${y(v).toFixed(2)} `;previous=true;previousScope=scopes[i]});return result}
function chart(selector,series,scopes,unit,options={}){const el=$(selector),years=state.pair.A.years,width=Math.max(270,Math.round(el.clientWidth)),height=245,left=43,right=unit==='%'&&options.endLabels!==false?84:24,top=20,bottom=32,plot=width-left-right;el.dataset.left=left;el.dataset.plot=plot;const values=series.flatMap(s=>s.values).filter(v=>v!==null&&Number.isFinite(v));if(!values.length){el.innerHTML=`<div class="missing-block">${unit==='%'?'이 기간에는 교역 기록 없음':'투표 자료 없음'}</div>`;return}const step=options.fixedMax?options.fixedMax/5:niceMax(Math.max(...values)/5),max=options.fixedMax||Math.max(step,Math.ceil(Math.max(...values)/step)*step),tickCount=Math.round(max/step),x=i=>left+i/(years.length-1)*plot,y=v=>top+(1-v/max)*(height-top-bottom);let svg=`<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${options.label||(unit==='%'?'교역 비중':'외교 거리')} · ${years[0]}–${years.at(-1)}년">`;for(let k=0;k<=tickCount;k++){const value=step*k,yy=y(value);svg+=`<line class="chart-grid" x1="${left}" x2="${width-right}" y1="${yy}" y2="${yy}"/><text x="${left-8}" y="${yy+4}" text-anchor="end" font-size="11">${new Intl.NumberFormat('ko',{maximumFractionDigits:2}).format(value)}${unit}</text>`}const ticks=[0,Math.round((years.length-1)/2),years.length-1];for(const i of ticks)svg+=`<text x="${x(i)}" y="${height-8}" text-anchor="middle" font-size="11">${years[i]}</text>`;series.forEach((s,k)=>{svg+=`<path class="chart-path" stroke="${s.color}" ${s.dash?'stroke-dasharray="7 5"':''} d="${pathFor(s.values,scopes,x,y)}"/>`;if(unit==='%'&&options.endLabels!==false){const last=s.values.findLastIndex(v=>v!==null);if(last>=0){let yy=y(s.values[last]);const other=series[1-k];const otherLast=other.values.findLastIndex(v=>v!==null);if(otherLast>=0&&Math.abs(yy-y(other.values[otherLast]))<32)yy+=k?19:-19;yy=Math.max(14,Math.min(height-bottom-4,yy));svg+=`<text x="${x(last)+8}" y="${yy}" font-size="11" style="fill:${s.color}"><tspan x="${x(last)+8}">${escapeHtml(s.base)} 기준</tspan><tspan x="${x(last)+8}" dy="14">${escapeHtml(s.partner)}</tspan></text>`}}});const i=state.probe;svg+=`<line class="probe-line" x1="${x(i)}" x2="${x(i)}" y1="${top}" y2="${height-bottom}"/>`;series.forEach(s=>{if(s.values[i]!==null)svg+=`<circle class="probe-dot" cx="${x(i)}" cy="${y(s.values[i])}" r="4.5" fill="${s.color}"/>`});svg+='</svg>';el.innerHTML=svg}
function drawCharts(){if(!state.pair||!$('#distance-chart'))return;const{a,b,A,B}=state.pair,p=A.partners[b],q=B.partners[a],style=getComputedStyle(document.body);const d=style.getPropertyValue('--distance').trim(),t=style.getPropertyValue('--trade').trim(),other=document.body.classList.contains('dark')?'#bba6f1':'#7656a4';chart('#distance-chart',[{values:p.dist,color:d}],A.years.map((_,i)=>`${A.vote_scope[i]}|${B.vote_scope[i]}`),'');chart('#trade-chart',[{values:p.share,color:t,base:a,partner:name(b).length>6?b:name(b)},{values:q.share,color:other,dash:true,base:b,partner:name(a).length>6?a:name(a)}],A.years.map((_,i)=>`${A.trade_scope[i]}|${B.trade_scope[i]}`),'%');drawDetails();updateProbe()}

function methodMarkup(){const m=state.meta;return `<article class="method-copy"><a class="back-link" href="#/">← 두 나라 고르기</a><h1>계산은 투명하게,<br>해석은 신중하게.</h1><h2>${L('여기서 말하는 외교 거리란?','What does diplomatic distance mean here?')}</h2><p>${L('유엔총회 투표 기록을 바탕으로 추정한 두 나라의 투표 성향 차이입니다. 연구진은 여러 표결에서 각 나라가 어떤 선택을 했는지 살펴보고, 그 성향을 하나의 숫자로 요약했습니다. 원자료는 이 숫자를 ‘이념 위치 점수’라고 부릅니다.','It is the difference between two countries’ estimated voting positions in the UN General Assembly. Researchers summarize patterns across many roll-call votes as a number called an ideal point.')}</p><p>${L('같은 회기에서 두 나라의 점수가 가까우면 추정된 투표 성향도 비슷합니다. 점수가 멀리 떨어져 있으면 그 성향이 더 다릅니다. PARALLEL은 두 점수 사이의 간격을 외교 거리라고 표시합니다.','In the same session, nearby scores mean similar estimated voting positions. Scores farther apart mean more different positions. PARALLEL calls the gap between those scores diplomatic distance.')}</p><div class="method-example"><h3>${L('실제 자료로 보면','A real-data example')}</h3><p>${L('2023년으로 표시된 한국·중국 자료','South Korea and China, labelled 2023')}</p><div class="example-values"><span>${escapeHtml(name('KOR'))}<b>${number(m.method_example.score_a)}</b></span><span>${escapeHtml(name('CHN'))}<b>${number(m.method_example.score_b)}</b></span><span>${L('외교 거리','Distance')}<b>${number(m.method_example.distance)}</b></span></div><p class="example-equation">|${number(m.method_example.score_a)} − (${number(m.method_example.score_b)})| ≈ ${number(m.method_example.distance)}</p><p class="fact-source">${sourceU()} · 2023 · IdealpointestimatesAll_Jun2024.csv<br>${L('표시는 소수 둘째 자리로 반올림했습니다. 실제 계산은 반올림 전 점수를 사용합니다.','Displayed scores are rounded to two decimals. Calculations use the unrounded scores.')}</p></div><p>${L('이 거리는 같은 표를 던진 비율이나 실제 양국 관계 전체를 뜻하지 않습니다. 동맹·정상회담·제재·여론은 이 숫자에 직접 들어 있지 않습니다. 점수 자체도 통계 모형으로 추정한 값입니다.','This distance is neither the fraction of identical votes nor a measure of the entire bilateral relationship. Alliances, summits, sanctions and public opinion are not direct inputs. The positions themselves are statistical estimates.')}</p><details class="method-details"><summary>${L('점수와 연도 처리를 더 자세히','More about the scores and year labels')}</summary><p>${L('원논문은 이 단일 축을 미국 주도 국제질서에 대한 국가별 입장 차이와 관련지어 해석합니다. 점수의 한 단위가 투표 한 번이나 외교 관계의 한 단위를 뜻하지는 않습니다.','The original paper interprets the single dimension in relation to positions toward the US-led liberal order. A unit on this scale is not one vote or a unit of bilateral relations.')} <a href="https://doi.org/10.1177/0022002715595700">Bailey, Strezhnev &amp; Voeten (2017)</a></p><p>${L('연구진이 공개한 점수를 그대로 사용하고, 우리 서비스가 새로 점수를 매기지는 않습니다. 유엔총회 자료는 회기로 묶여 있어, 2023년 표시는 2023년에 시작한 회기를 가리킵니다. 그 회기의 표결 일부는 다음 달력 연도까지 이어질 수 있습니다. 같은 판의 동의 점수 파일에 있는 회기·연도 연결을 사용합니다.','We use the researchers’ published scores without re-estimating them. UNGA records are grouped by session: the 2023 label identifies the session beginning in 2023, whose votes may extend into the next calendar year. Session-year labels come from the agreement-score file in the same release.')}</p></details><h2>교역 비중</h2><p>(A의 B 수출 + A의 B 수입) ÷ (A의 전체 수출 + 전체 수입) × 100. 방향이 있어 A에게 B의 비중과 B에게 A의 비중을 모두 보여줍니다. 원자료의 금액 단위는 천 미국 달러입니다.</p><h2>구간 변화와 빠진 기록</h2><p>같은 집계 범위의 최신 연속 관측 구간에서 처음 3년과 마지막 3년 평균을 비교합니다. 두 창이 겹치지 않게 최소 6년이 필요합니다. 빠진 해를 메우지 않습니다. 근거 없는 ‘거의 같다’ 기준을 쓰지 않고, 변화량을 그대로 표시합니다. 교역 비중의 변화 단위는 %p입니다.</p><h2>역사적 국가와 투표 자료가 없는 지역</h2><p>SCG와 SRB를 기간별로 구분하고 수단은 분리 전·후의 범위를 가로질러 변화량을 요약하지 않습니다. 벨기에–룩셈부르크 합산 기록을 개별 국가로 나누지 않습니다. 대만의 교역 기록은 분모에 포함하지만 서비스 기간의 투표값은 비워 둡니다.</p><h2>화면 표시 기준</h2><p>0.01% 미만은 산점도의 강조와 표 접기에만 쓰는 기본값입니다. 경제적 중요성이나 자료의 신뢰도를 가르는 기준이 아닙니다. 분모·사실·CSV·순위 상관 계산에서는 제외하지 않습니다. 모든 상대국 보기로 표시를 바꿀 수 있습니다.</p><p>‘거의 같다’는 상대 5% 경계는 채택하지 않았습니다. 분야에 맞는 동등성 경계를 정당화해야 한다는 방법론 원칙을 따라 변화량만 표시합니다. 화면은 소수 둘째 자리로 보여주되 더 작은 비영 변화는 0으로 표시하지 않습니다. <a href="https://doi.org/10.1177/2515245918770963">동등성 경계의 정당화에 관한 방법론</a></p><h2>다른 도구와의 쓰임새</h2><p>Tradeweave는 한 해의 수출입 상대국과 교역 집중도를 지도에서 살펴봅니다. PARALLEL은 두 나라의 투표 기준 거리와 양방향 교역 비중을 여러 해에 걸쳐 비교합니다. 한 나라의 상대국 화면도 거리와 교역 비중 사이의 관계를 살펴보는 데 초점을 둡니다.</p><p>역사적 코드의 시기는 <a href="https://unstats.un.org/unsd/methodology/m49/">UN M49</a>와 <a href="https://comtradeapi.un.org/files/v1/app/reference/Reporters.json">UN Comtrade 코드표</a>, 사용한 BACI 나라 코드표로 대조했습니다.</p><h2>${L('순위 상관','Rank correlation')}</h2><p>${L('한 해의 상대국별 외교 거리와 교역 비중에 각각 순위를 매기고 그 순위 사이의 피어슨 상관을 계산합니다. 동률에는 평균 순위를 씁니다. 두 값이 모두 있는 상대국만 사용하고 표의 표시 필터는 적용하지 않습니다. 공동 관측이 2개 미만이거나 한쪽 순위가 모두 같으면 계산하지 않습니다. 관측 상대국 구성은 해마다 달라질 수 있으며, 통계적 유의성이나 인과를 판정하지 않습니다.','Within each year, distances and trade shares are ranked across partners, then Pearson correlation is calculated between those ranks. Ties receive average ranks. Only partners with both values are included; the display filter is not applied. Fewer than two paired observations or constant ranks produce no coefficient. Partner coverage can change across years. No statistical significance or causal claim is made.')}</p><h2>해석의 범위</h2><p>두 선은 같은 시기의 변화를 보여 줄 뿐, 원인을 뜻하지 않습니다. 사실 카드는 정해진 계산 틀만 사용하며, 해석은 사람이 검수한 내용만 표시합니다.</p><p>${sourceCaptions()}<br>사용 자료 확인일 ${escapeHtml(m.sources.unga.downloaded_on)} · 생성일 ${escapeHtml((m.generated_at||'').slice(0,10))}</p></article>`}
function sourcesMarkup(){const m=state.meta;return `<article class="method-copy"><a class="back-link" href="#/">← 두 나라 고르기</a><h1>자료와 사진의 출처</h1><h2>UNGA 이념 위치 점수</h2><p><a href="${m.sources.unga.url}">${sourceU()}</a><br><a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0 1.0</a> · 다운로드 ${escapeHtml(m.sources.unga.downloaded_on)}<br>${escapeHtml(m.sources.unga.citation)}</p><h2>교역</h2><p><a href="${m.sources.baci.url}">${sourceT()}</a><br><a href="https://www.etalab.gouv.fr/licence-ouverte-open-licence/">Etalab Open Licence 2.0</a> · 다운로드 ${escapeHtml(m.sources.baci.trade_downloaded_on||'계산 준비 중')}<br>${escapeHtml(m.sources.baci.citation)}</p><h2>물류 설명용 사진</h2><p>배경은 선택한 국가 쌍이나 해당 연도의 실제 교역을 촬영한 사진을 뜻하지 않습니다.</p><p><a href="https://commons.wikimedia.org/wiki/File:Aerial_photograph_of_a_cargo_ship.jpg">Aerial photograph of a cargo ship — Wilfredor</a><br>카리브해·베네수엘라, 2012-08-26 · <a href="https://creativecommons.org/licenses/by-sa/3.0/">CC BY-SA 3.0</a>. ${L('화면 비율에 맞춘 표시와 어두운 덮개.','Responsive crop and dark overlay.')}</p><p><a href="https://commons.wikimedia.org/wiki/File:Container_port_(12848714813).jpg">Container port — KimonBerlin / Wikimedia Commons</a><br>싱가포르, 2014-01-25 · <a href="https://creativecommons.org/licenses/by-sa/2.0/">CC BY-SA 2.0</a>. 화면 비율에 맞춘 표시.</p><p><a href="https://commons.wikimedia.org/wiki/File:United_Nations_General_Assembly_Hall_(3).jpg">United Nations General Assembly Hall (3) — Basil D Soufi</a><br>2011-04-23 · <a href="https://creativecommons.org/licenses/by-sa/3.0/">CC BY-SA 3.0</a> · ${L('화면 비율에 맞춘 표시와 어두운 덮개.','Responsive crop and dark overlay.')}</p><p><a href="https://commons.wikimedia.org/wiki/File:Earth_Eastern_Hemisphere.jpg">Earth Eastern Hemisphere — NASA</a><br>2002-02-08 · Public domain · ${L('지구 이미지는 탐색 구간의 배경이며 지도 위의 관측값이 아닙니다.','The Earth image illustrates the exploration section; it is not plotted observational data.')}</p></article>`}
async function route(){stopCountryPlayback();const id=++state.renderId,hash=location.hash.slice(1),match=hash.match(/^pair\/([A-Z]{3})\/([A-Z]{3})$/),countryMatch=hash.match(/^country\/([A-Z]{3})\/(\d{4})$/),mode=match?'pair':countryMatch?'country':hash==='method'?'method':hash==='sources'?'sources':'home';state.pair=null;state.country=null;document.body.classList.toggle('pair-view',mode!=='home');$('#comparison').hidden=mode!=='pair';$('#country-page').hidden=mode!=='country';if(mode!=='country')$('#country-content').replaceChildren();$('#method').hidden=mode!=='method';$('#sources-page').hidden=mode!=='sources';document.querySelectorAll('.home-section').forEach(el=>el.hidden=mode!=='home');if(mode!=='home')finishBrandIntro();else homeCountries();if(mode==='pair')await renderPair(match[1],match[2],id);if(mode==='country')await renderCountry(countryMatch[1],Number(countryMatch[2]),id);if(mode==='method')$('#method-content').innerHTML=methodMarkup();if(mode==='sources')$('#sources-content').innerHTML=sourcesMarkup();scrollTo({top:0,behavior:'instant'})}
addEventListener('hashchange',()=>state.meta&&route());

function stopCountryPlayback(){if(countryTimer!==null){clearInterval(countryTimer);countryTimer=null}if($('#country-play'))$('#country-play').textContent=L('재생','Play')}
function countryLink(code,year){return `#country/${code}/${year}`}
function countryPeriodChange(code,partner,index){const d=state.country.data,part=d.partners[partner],transition=state.meta.comparison.transition_years_excluded_from_windows;let run=[],previousScope=null;for(let i=0;i<=index;i++){const scope=d.trade_scope[i]&&part.trade_scope?.[i]?`${d.trade_scope[i]}|${part.trade_scope[i]}`:null,year=d.years[i],valid=part.share[i]!==null&&scope&&!transition[code]?.includes(year)&&!transition[partner]?.includes(year);if(!valid){run=[];previousScope=null;continue}if(previousScope!==null&&scope!==previousScope)run=[];run.push(i);previousScope=scope}if(run.length<6)return null;const first=run.slice(0,3),last=run.slice(-3);return{value:last.reduce((s,i)=>s+part.share[i],0)/3-first.reduce((s,i)=>s+part.share[i],0)/3,first:first.map(i=>d.years[i]),last:last.map(i=>d.years[i])}}
function countryDomains(d){const all=[];for(const p of Object.values(d.partners))for(let i=0;i<d.years.length;i++)if(p.dist[i]!==null&&p.share[i]>0)all.push([p.dist[i],p.share[i]]);if(!all.length)return null;return{maxX:niceMax(Math.max(...all.map(p=>p[0]))),minLog:Math.floor(Math.log10(Math.min(...all.map(p=>p[1])))),maxLog:Math.ceil(Math.log10(Math.max(...all.map(p=>p[1]))))}}
async function renderCountry(code,year,id){$('#country-content').innerHTML=`<p class="error-panel">${L('자료를 불러오는 중입니다.','Loading data.')}</p>`;if(!state.countryMap.has(code)){ $('#country-content').innerHTML=`<p class="error-panel">${L('나라를 다시 골라 주세요.','Please choose a country again.')}</p>`;return}try{const data=await country(code);if(id!==state.renderId)return;const index=data.years.indexOf(year);if(index<0){$('#country-content').innerHTML=`<p class="error-panel">${L('지원하는 연도를 골라 주세요.','Choose a year in the supported range.')}</p>`;return}state.country={code,data,index,showAll:false,sort:'share',descending:true,domain:countryDomains(data)};$('#country-content').innerHTML=`<a class="back-link" href="#/">← ${L('두 나라 고르기','Choose two countries')}</a><div class="pair-heading"><div><h1>${escapeHtml(name(code))} · ${L('교역 상대국','Trade partners')}</h1><p>${data.years[0]}–${data.years.at(-1)} · ${L('가로축은 투표 거리, 세로축은 교역 비중','Voting distance on the horizontal axis, trade share on the vertical axis')}</p></div></div><div class="country-controls"><label>${L('연도','Year')} <strong id="country-year"></strong><input id="country-year-slider" type="range" min="0" max="${data.years.length-1}" value="${index}" aria-label="${L('국가 탐색 연도','Country exploration year')}"></label><button class="swap" id="country-play">${L('재생','Play')}</button></div><figure class="fig"><h2>${L('투표 거리와 교역 비중','Voting distance and trade share')}</h2><p class="axis-desc">${L('점 하나는 상대국 · 크기는 모두 같음 · 세로축은 로그 눈금','One point per partner · Equal point sizes · Logarithmic vertical axis')}</p><div id="country-scatter" class="chart-box"></div><p class="chart-sub" id="point-readout"></p><figcaption id="country-scatter-source"></figcaption></figure><div class="country-table-head"><h2>${L('상대국별 관측값','Partner observations')}</h2><label class="tiny-toggle"><input id="show-tiny" type="checkbox">${L('모든 상대국 보기','Show all partners')}</label></div><p class="stage-note" id="country-filter-note"></p><div class="table-scroll" tabindex="0" role="region" aria-label="${L('상대국 관측값 표. 안에서 세로로 스크롤합니다.','Partner observations table. Scroll vertically within this region.')}"><table class="country-table"><caption id="country-table-caption"></caption><thead><tr>${[['name',L('상대국','Partner')],['dist',L('외교 거리','Distance')],['share',L('교역 비중','Trade share')],['change',L('처음 대비 변화','Change from start')]].map(([key,label])=>`<th scope="col"><button type="button" data-sort="${key}">${label} ↕</button></th>`).join('')}</tr></thead><tbody id="country-table-body"></tbody></table></div><p class="stage-note">${L('변화는 선택한 해까지 같은 범위의 최신 연속 구간에서 처음·마지막 3년 평균의 차이(%p)입니다. 최소 6년이 필요합니다. 각 행의 변화 값에 비교 연도를 표시합니다.','Changes are percentage-point differences between the first and last three-year averages in the latest comparable consecutive period up to the selected year. At least six years are required. Each row identifies its comparison years.')}</p><figure class="fig correlation-figure"><h2>${L('상대국의 거리·교역 비중 순위 상관','Rank correlation across partners')}</h2><p class="axis-desc">${L('각 연도의 상대국 사이에서 계산한 스피어만 상관','Spearman correlation across partners within each year')}</p><div class="chart-box" id="country-correlation"></div><p class="chart-sub" id="country-correlation-readout"></p><figcaption>${L('상관이며 원인이 아님. 음수는 투표 거리가 작은 상대국의 교역 비중이 높은 순위에 놓이는 경향을 뜻합니다. 두 관측값이 모두 있는 상대국 전체를 사용하고 0.01% 표시 필터는 적용하지 않습니다.','Correlation, not causation. Negative values mean partners with smaller voting distances tend to rank higher in trade share. All partners with both observations are included, without the 0.01% display filter.')}<br>${sourceU()}<br>${sourceT()} · ${data.years[0]}–${data.years.at(-1)}<br>${L('n은 해당 연도의 공동 관측 상대국 수입니다. 동률에는 평균 순위를 부여합니다.','n is the number of partners with paired observations in that year. Ties receive average ranks.')}</figcaption></figure>`;$('#country-year-slider').oninput=e=>setCountryYear(Number(e.target.value));$('#country-play').onclick=()=>{if(countryTimer!==null){stopCountryPlayback();return}if(state.country.index===data.years.length-1)setCountryYear(0);$('#country-play').textContent=L('일시 정지','Pause');countryTimer=setInterval(()=>{if(!state.country||state.country.index===data.years.length-1){stopCountryPlayback();return}setCountryYear(state.country.index+1)},1000)};$('#show-tiny').onchange=e=>{state.country.showAll=e.target.checked;renderCountryTable()};$('#country-content').querySelector('thead').addEventListener('click',event=>{const button=event.target.closest('button[data-sort]');if(!button)return;const c=state.country;c.descending=c.sort===button.dataset.sort?!c.descending:!['name','dist'].includes(button.dataset.sort);c.sort=button.dataset.sort;renderCountryTable()});refreshCountry()}catch(error){if(id===state.renderId)$('#country-content').innerHTML=`<p class="error-panel">${L('이 나라의 자료를 불러오지 못했습니다.','This country’s data could not be loaded.')}</p>`}}
function setCountryYear(index){if(!state.country)return;state.country.index=index;history.replaceState(null,'',countryLink(state.country.code,state.country.data.years[index]));refreshCountry()}
function refreshCountry(){const c=state.country;if(!c)return;$('#country-year').textContent=c.data.years[c.index];$('#country-year-slider').value=c.index;drawCountryFigures();renderCountryTable()}
function drawCountryFigures(){if(!state.country||!$('#country-scatter'))return;drawScatter();drawCorrelation()}
function logLabel(exponent){if(exponent>=-3)return new Intl.NumberFormat(state.lang,{maximumFractionDigits:6}).format(10**exponent)+'%';const superscripts={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};return '10'+String(exponent).split('').map(c=>superscripts[c]).join('')+'%'}
function drawScatter(){const c=state.country,d=c.data,index=c.index,year=d.years[index],el=$('#country-scatter'),points=Object.entries(d.partners).filter(([,p])=>p.dist[index]!==null&&p.share[index]>0),domain=c.domain;$('#country-scatter-source').innerHTML=`${year} · ${L('관측값','Observations')} · ${points.length}${L('개 상대국',' partners')}<br>${sourceU()}<br>${sourceT()} · ${L('축 범위는 이 나라의 전체 관측기간에 고정합니다.','Axis bounds are fixed across this country’s observed period.')}`;$('#point-readout').textContent=L('점을 선택하면 두 나라의 쌍 화면으로 이동합니다.','Select a point to open the pair comparison.');if(!points.length||!domain){el.innerHTML=`<div class="missing-block">${d.score[index]===null?L('이 해에는 투표 자료 없음','No voting data for this year'):L('이 해에는 공동 관측값 없음','No paired observations for this year')}</div>`;return}const width=Math.max(280,el.clientWidth),height=340,left=65,right=18,top=22,bottom=50,minLog=domain.minLog,maxLog=domain.maxLog===minLog?minLog+1:domain.maxLog;const x=v=>left+v/domain.maxX*(width-left-right),y=v=>top+(maxLog-Math.log10(v))/(maxLog-minLog)*(height-top-bottom);let svg=`<svg viewBox="0 0 ${width} ${height}" role="group" aria-label="${L('상대국 산점도','Partner scatterplot')} ${year}">`;for(let i=0;i<=4;i++){const value=domain.maxX*i/4;svg+=`<line class="chart-grid" x1="${x(value)}" x2="${x(value)}" y1="${top}" y2="${height-bottom}"/><text x="${x(value)}" y="${height-bottom+22}" text-anchor="middle" font-size="11">${new Intl.NumberFormat(state.lang,{maximumFractionDigits:2}).format(value)}</text>`}const tickStep=Math.max(1,Math.ceil((maxLog-minLog)/8));for(let exponent=minLog;exponent<=maxLog;exponent+=tickStep){const yy=y(10**exponent);svg+=`<line class="chart-grid" x1="${left}" x2="${width-right}" y1="${yy}" y2="${yy}"/><text x="${left-8}" y="${yy+4}" text-anchor="end" font-size="11">${logLabel(exponent)}</text>`}svg+=`<text x="${left+(width-left-right)/2}" y="${height-5}" text-anchor="middle" font-size="12">${L('외교 거리 · 투표 기준','Diplomatic distance · UNGA votes')}</text>`;const color=getComputedStyle(document.body).getPropertyValue('--distance').trim();for(const[partner,p]of points){const label=`${name(partner)} · ${year} · ${L('외교 거리','Distance')} ${number(p.dist[index])} · ${withUnit(p.share[index],'%')}`;svg+=`<a href="#pair/${c.code}/${partner}" data-partner="${partner}" aria-label="${escapeHtml(label)}"><circle cx="${x(p.dist[index])}" cy="${y(p.share[index])}" r="4" fill="${color}" fill-opacity="${p.share[index]<state.meta.thresholds.tiny_partner_share_pct ? .35 : .8}" stroke="${color}" stroke-width="1"><title>${escapeHtml(label)}</title></circle></a>`}el.innerHTML=svg+'</svg>';for(const event of['pointerover','focusin'])el['on'+event]=e=>{const link=e.target.closest('a[data-partner]');if(link)$('#point-readout').textContent=link.getAttribute('aria-label')}}
function renderCountryTable(){const c=state.country,index=c.index,year=c.data.years[index],threshold=state.meta.thresholds.tiny_partner_share_pct;let hidden=0;let rows=Object.entries(c.data.partners).filter(([,p])=>{const tiny=p.share[index]!==null&&p.share[index]<threshold;if(tiny&&!c.showAll){hidden++;return false}return true}).map(([code,p])=>({code,dist:p.dist[index],share:p.share[index],change:countryPeriodChange(c.code,code,index)}));rows.sort((a,b)=>{let x=c.sort==='name'?name(a.code):c.sort==='change'?a.change?.value:a[c.sort],y=c.sort==='name'?name(b.code):c.sort==='change'?b.change?.value:b[c.sort];if(x===null||x===undefined)return y===null||y===undefined?0:1;if(y===null||y===undefined)return-1;const result=typeof x==='string'?x.localeCompare(y,state.lang):x-y;return c.descending?-result:result});$('#country-table-caption').textContent=year+' · '+sourceU()+' / '+sourceT();$('#country-filter-note').textContent=L(`${year}년 · 0.01% 미만 ${hidden}개 상대국을 접었습니다. 기록 없음은 0이 아닙니다.`,`${year} · ${hidden} partners below 0.01% are collapsed. No record does not mean zero.`);$('#country-table-body').innerHTML=rows.map(row=>{const change=row.change;return `<tr><td data-label="${L('상대국','Partner')}"><a href="#pair/${c.code}/${row.code}">${escapeHtml(name(row.code))}</a><span class="iso-label">${row.code}</span></td><td data-label="${L('외교 거리','Distance')}">${row.dist===null?L('투표 자료 없음','No voting data'):number(row.dist)}</td><td data-label="${L('교역 비중','Trade share')}">${row.share===null?L('기록 없음','No record'):withUnit(row.share,'%')}</td><td data-label="${L('처음 대비 변화','Change from start')}">${change?`${change.value>0?'+':change.value<0?'−':''}${withUnit(Math.abs(change.value),state.lang==='en'?' pp':'%p')}<small>${period(change.first)} → ${period(change.last)}</small>`:L('비교기간 부족','Insufficient period')}</td></tr>`}).join('')}
function drawCorrelation(){const c=state.country,d=c.data,el=$('#country-correlation'),values=d.rank_correlation||d.years.map(()=>null),index=c.index,width=Math.max(280,el.clientWidth),height=220,left=38,right=18,top=20,bottom=32,x=i=>left+i/(d.years.length-1)*(width-left-right),y=v=>top+(1-v)/2*(height-top-bottom),rho=values[index],n=d.rank_correlation_n?.[index]||0;$('#country-correlation-readout').textContent=`${d.years[index]} · ρ ${rho===null?L('계산 불가','Undefined'):number(rho,3)} · n=${n} · ${L('상관이며 원인이 아님','Correlation, not causation')}`;if(values.every(v=>v===null)){el.innerHTML=`<div class="missing-block">${L('순위 상관을 계산할 공동 관측값 없음','No paired observations to calculate rank correlation')}</div>`;return}let svg=`<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${L('연도별 순위 상관','Annual rank correlation')}">`;for(const tick of[-1,-.5,0,.5,1])svg+=`<line class="chart-grid" x1="${left}" x2="${width-right}" y1="${y(tick)}" y2="${y(tick)}"/><text x="${left-7}" y="${y(tick)+4}" text-anchor="end" font-size="11">${tick}</text>`;for(const i of[0,Math.round((d.years.length-1)/2),d.years.length-1])svg+=`<text x="${x(i)}" y="${height-8}" text-anchor="middle" font-size="11">${d.years[i]}</text>`;svg+=`<path class="chart-path" stroke="${getComputedStyle(document.body).getPropertyValue('--distance').trim()}" d="${pathFor(values,d.years.map((_,i)=>`${d.vote_scope[i]}|${d.trade_scope[i]}`),x,y)}"/><line class="probe-line" x1="${x(index)}" x2="${x(index)}" y1="${top}" y2="${height-bottom}"/>`;if(rho!==null)svg+=`<circle class="probe-dot" cx="${x(index)}" cy="${y(rho)}" r="4.5" fill="${getComputedStyle(document.body).getPropertyValue('--distance').trim()}"/>`;el.innerHTML=svg+'</svg>'}
new ResizeObserver(()=>{cancelAnimationFrame(countryResizeFrame);countryResizeFrame=requestAnimationFrame(drawCountryFigures)}).observe($('#country-page'));
addEventListener('visibilitychange',()=>{if(document.hidden)stopCountryPlayback()});

let introTimer=null,introHasRun=false;
function finishBrandIntro(){if(introTimer!==null){clearTimeout(introTimer);introTimer=null}document.body.classList.remove('intro-playing');const el=$('#brand-intro');if(el)el.dataset.phase='complete'}
function startBrandIntro(){if(introHasRun||!state.motion){finishBrandIntro();return}introHasRun=true;document.body.classList.add('intro-playing');$('#brand-intro').dataset.phase='playing';introTimer=setTimeout(finishBrandIntro,1300)}
async function showHomeSection(id){finishBrandIntro();if(document.body.classList.contains('pair-view')){history.pushState(null,'','#/');await route()}document.getElementById(id)?.scrollIntoView({behavior:state.motion?'smooth':'instant',block:'start'})}
function homeCountries(){for(const side of ['a','b']){const card=$('#selected-'+side);if(!card)continue;const code=resolveCountry($('#country-'+side).value),label=state.lang==='en'?'Country '+side.toUpperCase():'나라 '+side.toUpperCase();card.innerHTML=`<span class="chosen-side">${label}</span><strong translate="no">${code||'—'}</strong><span class="chosen-name">${code?escapeHtml(name(code)):(state.lang==='en'?'Not selected':'선택 전')}</span><i aria-hidden="true">↗</i>`}}
document.querySelectorAll('[data-scroll]').forEach(button=>button.onclick=()=>showHomeSection(button.dataset.scroll));
document.querySelectorAll('[data-pick]').forEach(button=>button.onclick=()=>{$('#country-'+button.dataset.pick).focus({preventScroll:true});finishBrandIntro()});
$('#pair-form').addEventListener('focusin',finishBrandIntro);
for(const side of ['a','b']){const input=$('#country-'+side);input.addEventListener('input',homeCountries);input.addEventListener('change',homeCountries)}
$('#input-swap').onclick=()=>{const a=$('#country-a'),b=$('#country-b');[a.value,b.value]=[b.value,a.value];homeCountries()};
$('.back-to-top').onclick=()=>scrollTo({top:0,behavior:state.motion?'smooth':'instant'});
$('#single-country-form').onsubmit=event=>{event.preventDefault();const code=resolveCountry($('#country-single').value);if(!code){$('#single-notice').textContent=state.lang==='en'?'Choose a country from the list.':'목록에서 나라를 골라 주세요.';return}location.hash=`country/${code}/${state.meta.period.vote_end}`};
document.querySelectorAll('[data-feature]').forEach(button=>button.onclick=async()=>{if(button.dataset.feature==='country'){await showHomeSection('country-entry');$('#country-single').focus({preventScroll:true});return}const a=resolveCountry($('#country-a').value),b=resolveCountry($('#country-b').value);if(a&&b&&a!==b){location.hash=`pair/${a}/${b}`;return}await showHomeSection('compare-main');$('#country-a').focus({preventScroll:true})});
homeCountries();
if(['','#/','#'].includes(location.hash))startBrandIntro();else{document.body.classList.add('pair-view');document.querySelectorAll('.home-section').forEach(el=>el.hidden=true);finishBrandIntro()}

function english(text){const core=text.trim();if(EN[core])return text.replace(core,EN[core]);let s=text;
 s=s.replace(/(\d{4}–\d{4})년 · 투표 자료의 연도는 회기 시작 연도 레이블/g,'$1 · Votes use session-start-year labels');
 s=s.replace(/기준연도/g,'Reference years').replace(/빠진 해는 선을 연결하지 않습니다\./g,'Lines do not connect missing years.');
 s=s.replace(/UNGA · Dataverse (\S+)판 내 Jun2024 파일/g,'UNGA · Dataverse v$1, Jun2024 legacy file');
 s=s.replace(/원자료 확인 /g,'Sources checked ').replace(/사용 자료 확인일 /g,'Sources checked ').replace(/생성일 /g,'Generated ').replace(/다운로드 /g,'Downloaded ');
 s=s.replace(/어두운 덮개와 화면 비율에 맞춘 표시\./g,'Dark overlay and responsive crop.').replace(/화면 비율에 맞춘 표시\./g,'Responsive crop.');s=s.replace(/카리브해·베네수엘라/g,'Caribbean Sea, Venezuela').replace(/싱가포르/g,'Singapore');
 s=s.replace(/회기–연도 연결 기준 표시 · 해당 연도를 각 관측값에 표시/g,'Session-year labels; each observation is labelled with its year').replace(/해당 연도를 각 관측값에 표시/g,'Each observation is labelled with its year');
 s=s.replace(/([A-Z]{3})에게 ([A-Z]{3}):/g,(_,a,b)=>`${b} in ${a} trade:`);if(s.includes('에게 '))s=s.split(' / ').map(part=>part.replace(/^(.*?)에게 (.*?)$/,(_,a,b)=>`${b} in ${a} trade`)).join(' / ');
 s=s.replace(/(.+) 상대국 보기/g,'Explore $1 partners');s=s.replace(/([A-Z]{3}) 기준/g,'For $1').replace(/외교 거리/g,'Diplomatic distance').replace(/교역 비중/g,'Trade share');
 s=s.replace(/(\d{4})년/g,'$1').replace(/계산 준비 중/g,'Not downloaded').replace(/투표 자료 없음/g,'No voting data').replace(/자료 없음/g,'No data').replace(/기록 없음/g,'No record');
 return s;
}
function applyLanguage(){document.documentElement.lang=state.lang;const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode:n=>['SCRIPT','STYLE'].includes(n.parentElement?.tagName)||n.parentElement?.closest('[translate="no"]')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});let node;while(node=walker.nextNode()){if(!originalText.has(node))originalText.set(node,node.nodeValue);const original=originalText.get(node),value=state.lang==='en'?english(original):original;if(node.nodeValue!==value)node.nodeValue=value}
 for(const el of document.querySelectorAll('[aria-label],[placeholder],[title],[alt]')){if(el.closest('[translate="no"]'))continue;let saved=originalAttributes.get(el);if(!saved){saved={};originalAttributes.set(el,saved)}for(const attr of['aria-label','placeholder','title','alt'])if(el.hasAttribute(attr)&&!(['theme','motion-toggle'].includes(el.id)&&attr==='aria-label')){const value=el.getAttribute(attr);if(!(attr in saved)||/[가-힣]/.test(value))saved[attr]=value;const next=state.lang==='en'?english(saved[attr]):saved[attr];if(value!==next)el.setAttribute(attr,next)}}
 const motionLabel=state.lang==='en'?(state.motion?'Pause motion':'Resume motion'):(state.motion?'모션 정지':'모션 재생');if($('#motion-toggle').getAttribute('aria-label')!==motionLabel)$('#motion-toggle').setAttribute('aria-label',motionLabel);
 const themeLabel=state.lang==='en'?(document.body.classList.contains('dark')?'Switch to light mode':'Switch to dark mode'):(document.body.classList.contains('dark')?'라이트 모드로 보기':'다크 모드로 보기');if($('#theme').getAttribute('aria-label')!==themeLabel)$('#theme').setAttribute('aria-label',themeLabel);
}

function factMarkupEn(){const{a,b,A,B}=state.pair,p=A.partners[b],q=B.partners[a],common=p.comparison,trade=p.trade_comparison;let text='';if(common)text+=`<p class="fact-line">Diplomatic distance between ${escapeHtml(name(a))} and ${escapeHtml(name(b))}:<br><b>${number(common.dist_first)}</b> in ${period(common.years_first)} → <b>${number(common.dist_last)}</b> in ${period(common.years_last)} (three-year averages).<br>${direction(common.dist_change,'dist')}.</p>`;else text+=`<p class="fact-line">${p.dist.every(v=>v===null)?'No voting data.':'Too few consecutive comparable observations.'} No period change in distance is reported.</p>`;const comp=common||trade;if(comp){for(const[base,partner,summary]of[[a,b,comp],[b,a,common?q.comparison:q.trade_comparison]])if(summary)text+=`<p class="fact-line">${escapeHtml(name(partner))}’s share of ${escapeHtml(name(base))}’s trade:<br><b>${withUnit(summary.share_first,'%')}</b> in ${period(summary.years_first)} → <b>${withUnit(summary.share_last,'%')}</b> in ${period(summary.years_last)} (three-year averages).<br>${direction(summary.share_change,'share')}.</p>`}else text+='<p class="fact-line">Too few consecutive observations to summarize trade-share changes.</p>';return text+`<p class="fact-source">First and last three-year averages; changes use unrounded means. Comparisons do not cross missing years or geographical scope boundaries.<br>${sourceCaptions()}</p>`}
function makePairCsv(){const{a,b,A,B}=state.pair,p=A.partners[b],q=B.partners[a],lines=[`# ${sourceU()}`,`# ${sourceT()}`,`# agreement=AgreementScoresAll_Jun2024.csv; Dataverse ${state.meta.sources.unga.version}; scale=0_to_1; definition=session_mean_of_1_minus_absolute_vote_difference_divided_by_2`, `# years=${A.years[0]}-${A.years.at(-1)}; source_checked=${state.meta.sources.unga.downloaded_on}; generated=${state.meta.generated_at}`,`# trade_values=thousand_USD; share_values=percent; missing_observations=empty_numeric_cell_with_status; display_columns_match_screen`];
 if(p.comparison)lines.push(`# comparison_first=${p.comparison.years_first.join('|')}; comparison_last=${p.comparison.years_last.join('|')}`);
 const headers=['year','country_a','country_b','score_a','score_b','distance','agreement_0_to_1','share_a_pct','share_b_pct','share_export_a_pct','share_import_a_pct','share_export_b_pct','share_import_b_pct','bilateral_value_thousand_usd','total_trade_a_thousand_usd','total_trade_b_thousand_usd','distance_display','share_a_display','share_b_display','agreement_display','share_export_a_display','share_import_a_display','share_export_b_display','share_import_b_display','vote_status','trade_a_status','trade_b_status','unga_version','baci_version'];
 const csvCell=v=>v===null||v===undefined?'':`"${String(v).replace(/"/g,'""')}"`;lines.push(headers.join(','));A.years.forEach((year,i)=>lines.push([year,a,b,A.score[i],B.score[i],p.dist[i],p.agreement[i],p.share[i],q.share[i],p.share_export[i],p.share_import[i],q.share_export[i],q.share_import[i],p.value[i],A.total_trade[i],B.total_trade[i],p.dist[i]===null?(state.lang==='ko'?'투표 자료 없음':'No voting data'):number(p.dist[i]),p.share[i]===null?(state.lang==='ko'?'기록 없음':'No record'):withUnit(p.share[i],'%'),q.share[i]===null?(state.lang==='ko'?'기록 없음':'No record'):withUnit(q.share[i],'%'),p.agreement[i]===null?(state.lang==='ko'?'투표 자료 없음':'No voting data'):number(p.agreement[i],3),...[p.share_export[i],p.share_import[i],q.share_export[i],q.share_import[i]].map(v=>v===null?(state.lang==='ko'?'기록 없음':'No record'):withUnit(v,'%')),p.dist[i]===null?'missing':'observed',p.share[i]===null?'no_record':'observed',q.share[i]===null?'no_record':'observed',state.meta.sources.unga.version,state.meta.sources.baci.version].map(csvCell).join(',')));return '\ufeff'+lines.join('\r\n')+'\r\n'}
