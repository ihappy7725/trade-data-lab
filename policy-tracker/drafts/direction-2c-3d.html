<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Policyline 시안 2c · 제도와 선 (3D)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* 색 토큰 — theme-factory Ocean Depths 바탕 */
  --color-bg:#0E1A2E;
  --color-bg-deep:#08111F;
  --color-surface:#16263F;
  --color-surface-top:#1D3150;
  --color-edge:rgba(190,215,240,.14);
  --color-highlight:rgba(220,235,255,.10);
  --color-grid:rgba(168,196,220,.07);
  --color-text:#F1F5F8;
  --color-text-muted:#93A3B8;
  --color-rule:rgba(168,196,220,.16);
  --color-brand:#F1F5F8;
  --color-brand-edge:#9FB2C8;
  --color-brand-text:#0E1A2E;
  --color-data:#A8DADC;
  --color-accent:#FF6B3D;
  --color-focus:#7FB8FF;
  --shadow-1:0 1px 0 var(--color-highlight) inset,0 2px 4px rgba(0,0,0,.25),0 8px 16px rgba(0,0,0,.25);
  --shadow-2:0 1px 0 var(--color-highlight) inset,0 4px 8px rgba(0,0,0,.3),0 16px 32px rgba(0,0,0,.35),0 32px 64px rgba(0,0,0,.25);
  --font-title:"Noto Serif KR", serif;
  --font-body:"IBM Plex Sans KR", system-ui, sans-serif;
  --space-1:8px;--space-2:16px;--space-3:24px;--space-4:32px;--space-6:48px;--space-8:64px;--space-12:96px;
  --radius:12px;
  --ease-out:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);color:var(--color-text);font-size:16px;line-height:1.6;word-break:keep-all;font-variant-numeric:tabular-nums;background:var(--color-bg);overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit}
.draft{position:relative;z-index:2;background:var(--color-accent);color:var(--color-brand-text);font-size:13px;padding:var(--space-1) var(--space-2);text-align:center;font-weight:500}
.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 var(--space-6)}

/* 3D floor grid behind the hero */
.floor{position:absolute;inset:0 0 auto 0;height:960px;overflow:hidden;pointer-events:none;perspective:700px;z-index:0}
.floor::before{content:"";position:absolute;left:-50%;right:-50%;top:40%;height:140%;
  background-image:linear-gradient(var(--color-grid) 1px,transparent 1px),linear-gradient(90deg,var(--color-grid) 1px,transparent 1px);
  background-size:80px 80px;transform:rotateX(62deg);transform-origin:top;
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,transparent 70%);mask-image:linear-gradient(to bottom,#000 0%,transparent 70%)}
.floor::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 70% 35%,rgba(127,184,255,.10),transparent 70%)}

/* nav */
nav{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-3) 0}
.logo{display:flex;align-items:center;gap:12px;font-weight:600;font-size:18px;letter-spacing:.18em;text-decoration:none}
.logo i{width:3px;height:26px;background:var(--color-accent);display:block;box-shadow:0 0 12px rgba(255,107,61,.6)}
.links{display:flex;gap:var(--space-4);font-size:15px;color:var(--color-text-muted)}
.links a{text-decoration:none}
.links a:hover{color:var(--color-text)}
.nav-right{display:flex;align-items:center;gap:var(--space-2)}
.lang{display:inline-flex;padding:4px;border-radius:999px;background:var(--color-bg-deep);box-shadow:inset 0 2px 4px rgba(0,0,0,.5),0 1px 0 var(--color-highlight)}
.lang button{border:0;background:none;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--color-text-muted);cursor:pointer;transition:transform .15s var(--ease-out)}
.lang button[aria-pressed="true"]{background:var(--color-surface-top);color:var(--color-text);box-shadow:var(--shadow-1)}
.lang button:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}
.lang button:active{transform:scale(.95)}

/* 3D buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 var(--space-4);background:var(--color-brand);color:var(--color-brand-text);font:600 17px/1 var(--font-body);border:0;border-radius:10px;text-decoration:none;cursor:pointer;
  box-shadow:0 4px 0 var(--color-brand-edge),0 8px 24px rgba(0,0,0,.35);transition:transform .18s var(--ease-out),box-shadow .18s var(--ease-out)}
.btn.small{min-height:40px;padding:0 var(--space-2);font-size:14px;box-shadow:0 3px 0 var(--color-brand-edge),0 6px 16px rgba(0,0,0,.3)}
.btn:hover{transform:translateY(-2px)}
.btn:focus-visible{outline:3px solid var(--color-focus);outline-offset:4px}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--color-brand-edge),0 2px 8px rgba(0,0,0,.3);transition-duration:.08s}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--color-surface-top);color:var(--color-text);box-shadow:0 4px 0 var(--color-bg-deep),var(--shadow-1)}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:var(--space-8);align-items:center;min-height:calc(100vh - 140px);padding:var(--space-6) 0 var(--space-12)}
h1{font-family:var(--font-title);font-weight:300;font-size:clamp(38px,4.6vw,66px);line-height:1.16;letter-spacing:-.02em}
h1 span{display:block;color:var(--color-text-muted)}
.lede{color:var(--color-text-muted);font-size:18px;max-width:32em;margin:var(--space-4) 0 var(--space-6)}
.trust{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);margin-top:var(--space-3);font-size:14px;color:var(--color-text-muted);list-style:none;padding:0}
.trust li::before{content:"✔";color:var(--color-data);margin-right:6px}

/* 3D stack of policy sheets */
.stack{position:relative;height:420px;perspective:1400px}
.sheet{position:absolute;left:8%;right:4%;padding:var(--space-3);border-radius:var(--radius);text-decoration:none;
  background:linear-gradient(180deg,var(--color-surface-top),var(--color-surface));border:1px solid var(--color-edge);box-shadow:var(--shadow-2);
  transform-style:preserve-3d;transform:rotateX(14deg) rotateY(-20deg) rotateZ(2deg) translate3d(var(--x),var(--y),var(--z));
  opacity:0;animation:rise .7s var(--ease-out) forwards;animation-delay:var(--d);transition:transform .3s var(--ease-out)}
.sheet time{font-size:13px;color:var(--color-text-muted)}
.sheet b{display:block;font-family:var(--font-title);font-weight:400;font-size:20px;line-height:1.35;margin-top:4px}
.sheet .bar{position:absolute;right:var(--space-3);top:var(--space-2);bottom:var(--space-2);width:3px;border-radius:2px;background:var(--color-accent);box-shadow:0 0 16px rgba(255,107,61,.55)}
.sheet:hover{transform:rotateX(14deg) rotateY(-20deg) rotateZ(2deg) translate3d(calc(var(--x) - 16px),calc(var(--y) - 8px),calc(var(--z) + 40px))}
.sheet:focus-visible{outline:3px solid var(--color-focus);outline-offset:4px}
@keyframes rise{from{opacity:0;transform:rotateX(14deg) rotateY(-20deg) rotateZ(2deg) translate3d(var(--x),calc(var(--y) + 40px),var(--z))}to{opacity:1}}

/* sections */
section.block{padding:var(--space-12) 0;border-top:1px solid var(--color-rule)}
h2{font-family:var(--font-title);font-weight:400;font-size:clamp(28px,3vw,40px);line-height:1.25;margin-bottom:var(--space-2)}
.section-lede{color:var(--color-text-muted);max-width:38em;margin-bottom:var(--space-6)}

/* filter */
.panel{background:linear-gradient(180deg,var(--color-surface-top),var(--color-surface));border:1px solid var(--color-edge);border-radius:var(--radius);box-shadow:var(--shadow-2)}
.filters{display:flex;flex-wrap:wrap;gap:var(--space-1);margin-bottom:var(--space-3)}
.chip{border:0;cursor:pointer;padding:8px 16px;border-radius:999px;font-size:14px;font-weight:500;background:var(--color-bg-deep);color:var(--color-text-muted);box-shadow:inset 0 2px 4px rgba(0,0,0,.5),0 1px 0 var(--color-highlight);transition:transform .15s var(--ease-out)}
.chip[aria-pressed="true"]{background:var(--color-surface-top);color:var(--color-text);box-shadow:0 3px 0 var(--color-bg-deep),var(--shadow-1)}
.chip:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}
.chip:active{transform:translateY(2px)}

/* policy rows */
.rows{display:grid;gap:var(--space-2)}
.row{display:grid;grid-template-columns:110px 1fr minmax(260px,40%);gap:var(--space-4);align-items:center;padding:var(--space-3);text-decoration:none;
  background:linear-gradient(180deg,var(--color-surface-top),var(--color-surface));border:1px solid var(--color-edge);border-radius:var(--radius);box-shadow:var(--shadow-1);transition:transform .2s var(--ease-out),box-shadow .2s var(--ease-out)}
.row[hidden]{display:none}
.row time{color:var(--color-text-muted);font-size:15px}
.row .type{display:inline-block;font-size:12px;color:var(--color-data);border:1px solid rgba(168,218,220,.35);border-radius:999px;padding:0 8px;margin-bottom:6px}
.row h3{font-family:var(--font-title);font-weight:400;font-size:21px;line-height:1.35}
.row p{color:var(--color-text-muted);font-size:14px;margin-top:4px}
.row .go{display:inline-block;margin-top:var(--space-1);font-size:14px;font-weight:600;color:var(--color-accent)}
.row svg{width:100%;height:88px;display:block}
.row small{display:block;font-size:12px;color:var(--color-text-muted);text-align:right;margin-top:4px}
.row:hover{transform:translateY(-4px);box-shadow:var(--shadow-2)}
.row:hover .go{text-decoration:underline}
.row:focus-visible{outline:3px solid var(--color-focus);outline-offset:3px}
.row:active{transform:translateY(0);box-shadow:var(--shadow-1);transition-duration:.08s}

/* what you see: 3 tilted panels */
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3);perspective:1600px}
.card{padding:var(--space-4);transform:rotateY(var(--ry,0deg));transition:transform .3s var(--ease-out)}
.card:nth-child(1){--ry:5deg}.card:nth-child(3){--ry:-5deg}
.card:hover{transform:rotateY(0deg) translateY(-4px)}
.card .icon{width:48px;height:48px;border-radius:10px;display:grid;place-items:center;background:var(--color-bg-deep);box-shadow:inset 0 2px 4px rgba(0,0,0,.5),0 1px 0 var(--color-highlight);margin-bottom:var(--space-3)}
.card h3{font-family:var(--font-title);font-weight:400;font-size:22px;margin-bottom:var(--space-1)}
.card p{color:var(--color-text-muted);font-size:15px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:var(--space-2);font-size:12px;text-align:center}
.cols3 span{padding:6px 4px;border-radius:6px;background:var(--color-bg-deep)}

/* caveats */
.caveats{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-2)}
.caveat{padding:var(--space-3) var(--space-4)}
.caveat h3{font-size:17px;font-weight:600;margin-bottom:4px}
.caveat p{color:var(--color-text-muted);font-size:15px}

/* cite */
.cite{display:grid;grid-template-columns:1fr auto;gap:var(--space-3);align-items:center;padding:var(--space-4)}
.cite code{display:block;font-family:var(--font-body);font-size:15px;line-height:1.7;padding:var(--space-2) var(--space-3);border-radius:8px;background:var(--color-bg-deep);box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}
.cite-actions{display:flex;flex-direction:column;gap:var(--space-2)}
.cite small{grid-column:1/-1;color:var(--color-text-muted);font-size:13px}

/* source table */
.src{width:100%;border-collapse:collapse;font-size:15px}
.src th,.src td{text-align:left;padding:var(--space-2);border-bottom:1px solid var(--color-rule);vertical-align:top}
.src th{width:28%;color:var(--color-text-muted);font-weight:500}
.src-wrap{padding:var(--space-2) var(--space-3)}

/* toast */
.toast{position:fixed;left:50%;bottom:var(--space-4);padding:12px 20px;border-radius:10px;background:var(--color-brand);color:var(--color-brand-text);font-weight:600;box-shadow:var(--shadow-2);transform:translate(-50%,24px);opacity:0;pointer-events:none;transition:transform .14s ease-in,opacity .14s ease-in;z-index:5}
.toast.show{transform:translate(-50%,0);opacity:1;transition:transform .32s var(--ease-out),opacity .32s var(--ease-out)}

footer{padding:var(--space-8) 0;font-size:13px;color:var(--color-text-muted);border-top:1px solid var(--color-rule)}

@media (max-width:980px){
  .hero{grid-template-columns:1fr;min-height:0;padding-top:var(--space-6);gap:var(--space-6)}
  .stack{height:340px}
  .trio{grid-template-columns:1fr}.card{--ry:0deg!important}
}
@media (max-width:760px){
  .wrap{padding:0 var(--space-2)}
  .links{display:none}
  .row{grid-template-columns:1fr;gap:var(--space-1)}.row small{text-align:left}
  .caveats{grid-template-columns:1fr}
  .cite{grid-template-columns:1fr}.cite-actions{flex-direction:row;flex-wrap:wrap}
  .stack{height:300px;overflow:clip}.sheet{left:0;right:15%}
  section.block{padding:var(--space-8) 0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before{animation:none!important;transition:none!important}
  .sheet{opacity:1}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>
<div class="floor" aria-hidden="true"></div>
<div class="draft" data-i18n="draft"></div>
<div class="wrap">
  <nav>
    <a class="logo" href="#"><i></i>POLICYLINE</a>
    <div class="links">
      <a href="#list" data-i18n="nav.list"></a>
      <a href="#how" data-i18n="nav.how"></a>
      <a href="#caveats" data-i18n="nav.caveats"></a>
      <a href="#source" data-i18n="nav.source"></a>
    </div>
    <div class="nav-right">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="ko" aria-pressed="true">한</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </nav>

  <header class="hero">
    <div>
      <h1 data-i18n="hero.h1"></h1>
      <p class="lede" data-i18n="hero.sub"></p>
      <a class="btn" href="#list" data-i18n="hero.cta"></a>
      <ul class="trust"><li data-i18n="hero.trust1"></li><li data-i18n="hero.trust2"></li></ul>
    </div>
    <div class="stack" id="stack"></div>
  </header>

  <section class="block" id="list">
    <h2 data-i18n="list.h2"></h2>
    <p class="section-lede" data-i18n="list.lede"></p>
    <div class="filters" role="group" id="filters"></div>
    <div class="rows" id="rows"></div>
  </section>

  <section class="block" id="how">
    <h2 data-i18n="how.h2"></h2>
    <p class="section-lede" data-i18n="how.lede"></p>
    <div class="trio">
      <div class="panel card">
        <div class="icon" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24"><polyline points="2,16 7,12 11,14 12,4 12,20 13,18 17,19 22,18" fill="none" stroke="var(--color-data)" stroke-width="2"/><line x1="12" y1="2" x2="12" y2="22" stroke="var(--color-accent)" stroke-width="2"/></svg></div>
        <h3 data-i18n="how.c1.h"></h3><p data-i18n="how.c1.p"></p>
      </div>
      <div class="panel card">
        <div class="icon" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24"><rect x="2" y="5" width="6" height="14" rx="1" fill="var(--color-data)"/><rect x="9" y="5" width="6" height="14" rx="1" fill="var(--color-text-muted)"/><rect x="16" y="5" width="6" height="14" rx="1" fill="none" stroke="var(--color-text-muted)" stroke-dasharray="2 2"/></svg></div>
        <h3 data-i18n="how.c2.h"></h3><p data-i18n="how.c2.p"></p>
        <div class="cols3"><span data-i18n="how.fact"></span><span data-i18n="how.interp"></span><span data-i18n="how.unsure"></span></div>
      </div>
      <div class="panel card">
        <div class="icon" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z" fill="none" stroke="var(--color-data)" stroke-width="2"/><line x1="9" y1="12" x2="16" y2="12" stroke="var(--color-text-muted)" stroke-width="2"/><line x1="9" y1="16" x2="14" y2="16" stroke="var(--color-text-muted)" stroke-width="2"/></svg></div>
        <h3 data-i18n="how.c3.h"></h3><p data-i18n="how.c3.p"></p>
      </div>
    </div>
  </section>

  <section class="block" id="caveats">
    <h2 data-i18n="cav.h2"></h2>
    <p class="section-lede" data-i18n="cav.lede"></p>
    <div class="caveats">
      <div class="panel caveat"><h3 data-i18n="cav.1.h"></h3><p data-i18n="cav.1.p"></p></div>
      <div class="panel caveat"><h3 data-i18n="cav.2.h"></h3><p data-i18n="cav.2.p"></p></div>
      <div class="panel caveat"><h3 data-i18n="cav.3.h"></h3><p data-i18n="cav.3.p"></p></div>
      <div class="panel caveat"><h3 data-i18n="cav.4.h"></h3><p data-i18n="cav.4.p"></p></div>
    </div>
  </section>

  <section class="block" id="cite">
    <h2 data-i18n="cite.h2"></h2>
    <p class="section-lede" data-i18n="cite.lede"></p>
    <div class="panel cite">
      <code id="citeText" data-i18n="cite.example"></code>
      <div class="cite-actions">
        <button class="btn ghost small" type="button" id="copyBtn" data-i18n="cite.copy"></button>
        <button class="btn ghost small" type="button" disabled data-i18n="cite.csv"></button>
      </div>
      <small data-i18n="cite.note"></small>
    </div>
  </section>

  <section class="block" id="source">
    <h2 data-i18n="src.h2"></h2>
    <div class="panel src-wrap">
      <table class="src">
        <tr><th data-i18n="src.r1.k"></th><td data-i18n="src.r1.v"></td></tr>
        <tr><th data-i18n="src.r2.k"></th><td data-i18n="src.r2.v"></td></tr>
        <tr><th data-i18n="src.r3.k"></th><td data-i18n="src.r3.v"></td></tr>
        <tr><th data-i18n="src.r4.k"></th><td data-i18n="src.r4.v"></td></tr>
      </table>
    </div>
  </section>

  <footer data-i18n="footer"></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const I18N={
ko:{
 "draft":"디자인 시안 2c · 미리보기 그래프는 <b>가상</b>입니다 · 정책 날짜는 원문 확인 전",
 "nav.list":"정책 5건","nav.how":"보는 것","nav.caveats":"읽을 때 주의","nav.source":"출처",
 "hero.h1":"정책 발표 전후 12개월,<span>교역량의 객관적 변화</span>",
 "hero.sub":"관세와 수출통제 등 주요 정책 시점을 기점으로 달라진 월별 교역 데이터를 나란히 비교합니다. 원인을 단정 짓지 않고, 같은 시기에 일어난 시장의 실제 변화만 제공합니다.",
 "hero.cta":"분석할 정책 선택하기","hero.trust1":"로그인 없이 즉시 확인","hero.trust2":"투명한 출처 표기",
 "list.h2":"분석할 정책 고르기","list.lede":"정책 종류로 좁혀 보고, 목록에서 하나를 고르세요. 미리보기의 붉은 선이 발표일입니다.",
 "f.all":"전체","f.tariff":"관세","f.export":"수출통제",
 "row.go":"발표 전후 보기","row.note":"전후 12개월 미리보기 · 가상",

let lang="ko",filter="all";
try{const saved=localStorage.getItem("policyline-lang");if(saved==="en"||saved==="ko")lang=saved}catch(e){}
const t=k=>I18N[lang][k]??k;
const fmt=d=>lang==="ko"?d.replaceAll("-","."):new Date(d+"T00:00:00").toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"});

function spark(s){const w=400,h=88,max=Math.max(...s),x=i=>i*w/(s.length-1),y=v=>h-6-(v/max)*(h-14);
 return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="${w}" y1="${h-1}" y2="${h-1}" stroke="var(--color-rule)" vector-effect="non-scaling-stroke"/><line x1="${x(12)}" y1="0" x2="${x(12)}" y2="${h}" stroke="var(--color-accent)" stroke-width="2" vector-effect="non-scaling-stroke"/><polyline points="${s.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ')}" fill="none" stroke="var(--color-data)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`}

function render(){
 document.documentElement.lang=lang;
 document.querySelectorAll("[data-i18n]").forEach(el=>{el.innerHTML=t(el.dataset.i18n)});
 document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
 // 3D stack: three most recent
 document.getElementById("stack").innerHTML=P.slice(0,3).map((p,i)=>`
  <a class="sheet" href="#p${i}" style="--x:${i*28}px;--y:${40+i*104}px;--z:${-i*60}px;--d:${(.15+i*.12).toFixed(2)}s;z-index:${3-i}">
   <time datetime="${p.d}">${fmt(p.d)}</time><b>${p[lang]}</b><i class="bar" aria-hidden="true"></i>
  </a>`).join("");
 // filters
 document.getElementById("filters").innerHTML=["all","tariff","export"].map(f=>`<button class="chip" type="button" data-f="${f}" aria-pressed="${f===filter}">${t("f."+f)}</button>`).join("");
 // rows
 document.getElementById("rows").innerHTML=P.map((p,i)=>`
 <a class="row" id="p${i}" href="#p${i}" ${filter!=="all"&&p.type!==filter?"hidden":""}>
  <time datetime="${p.d}">${fmt(p.d)}</time>
  <div><span class="type">${t("f."+p.type)}</span><h3>${p[lang]}</h3><p>${p.item[lang]} · HS ${p.hs} · ${p.flow[lang]}</p><span class="go">${t("row.go")}</span></div>
  <div>${spark(p.s)}<small>${t("row.note")}</small></div>
 </a>`).join("");
}
document.querySelector(".lang").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.lang;try{localStorage.setItem("policyline-lang",lang)}catch(e){}render()});
document.getElementById("filters").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;filter=b.dataset.f;render()});
let toastTimer;
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),2200)}
document.getElementById("copyBtn").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(document.getElementById("citeText").textContent);toast(t("toast"))}catch(e){toast(t("toast.fail"))}});
render();
</script>
