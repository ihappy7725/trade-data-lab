# Policyline: 매주 새 정책 후보(미국 Federal Register · EU 관보)를 모아 GitHub 이슈로 올린다.
# 이슈는 "검토 대기"일 뿐이다. 원문 확인 후 policy-tracker/data/policies-list.json 에 넣어야 화면에 나온다.
name: Policyline policy candidates

on:
  schedule:
    - cron: "0 0 * * 1"   # 매주 월요일 00:00 UTC (한국 시간 09:00)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: policy-tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect candidates and open issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/collect_candidates.py --days 8 --issues
