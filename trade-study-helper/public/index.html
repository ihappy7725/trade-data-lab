<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Muma · 무역 공부 도우미</title>
  <meta name="description" content="내 무역 노트에서 근거를 찾아 답하는 Muma">
  <link rel="stylesheet" href="css/style.css?v=2">
  <!-- 지도·지구본 계산 도구 (jsDelivr 고정 버전) -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
</head>
<body data-mode="home">
  <!-- 배경: 점으로 된 지구본 (처음) → 답이 나오면 2D 지도로 펼쳐짐 -->
  <canvas id="globe" aria-hidden="true"></canvas>

  <!-- 상단 바 -->
  <header class="top">
    <button id="menu" class="icon-btn" type="button" aria-label="기록 열기" aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <a class="logo" href="./" aria-label="Muma 처음으로">
      <canvas id="logo-canvas" width="60" height="60" aria-hidden="true"></canvas>
      <span class="logo-word">Muma</span>
    </a>
    <span class="tag">가상 문서로 연습 중</span>
  </header>

  <!-- 왼쪽 기록 사이드바 -->
  <aside id="sidebar" class="sidebar" aria-label="대화 기록">
    <div class="side-head">
      <button id="new-chat" class="side-new" type="button">+ 새 대화</button>
      <button id="side-close" class="icon-btn" type="button" aria-label="기록 닫기">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <p class="side-title">최근 질문</p>
    <ul id="history-list" class="history-list"></ul>
  </aside>

  <!-- 대화 영역: 처음부터 바로 채팅창. 답변은 위에서 아래로 쌓임 -->
  <section id="thread" class="thread" aria-live="polite">
    <div id="messages" class="messages"></div>
  </section>

  <!-- 입력창: 하단 고정 -->
  <form id="composer" class="composer" autocomplete="off">
    <label class="sr-only" for="question">질문</label>
    <input id="question" type="text" maxlength="300" placeholder="무역 질문을 무엇이든 물어보세요" required>
    <button id="send" type="submit" aria-label="보내기">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <p id="status" class="status" role="status"></p>
  </form>

  <script src="js/app.js?v=2"></script>
</body>
</html>
