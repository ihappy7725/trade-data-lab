# Policyline: 매달 UN Comtrade 월별 자료를 다시 받아, 바뀐 것이 있으면 커밋한다.
# 커밋이 main 에 올라가면 Vercel 이 policy-tracker 를 자동으로 다시 배포한다.
# API 키는 저장소 Settings → Secrets and variables → Actions 의 COMTRADE_KEY 에 둔다 (코드에 넣지 않음).
name: Policyline data refresh

on:
  schedule:
    - cron: "0 3 5 * *"   # 매달 5일 03:00 UTC (한국 시간 12:00)
  workflow_dispatch: {}   # Actions 탭에서 손으로도 돌릴 수 있음

permissions:
  contents: write

concurrency:
  group: policyline-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: policy-tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch monthly trade data
        env:
          COMTRADE_KEY: ${{ secrets.COMTRADE_KEY }}
        run: python3 scripts/fetch_comtrade.py

      - name: Commit if data changed
        run: |
          if git diff --quiet -- data/policies.json data/policies.js; then
            echo "바뀐 데이터 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/policies.json data/policies.js
          git commit -m "Policyline: refresh UN Comtrade monthly data ($(date -u +%Y-%m-%d))"
          git push
