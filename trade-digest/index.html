<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Trade Digest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Hahmlet:wght@300;400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
<style>
:root{
  /* 서재 · 서가: 종이 바탕, 딥그린 가죽, 호두나무, 황동 */
  --ground:#ECE7DC; --dot:rgba(70,52,28,.10);
  --surface:#FBF9F4; --surface-2:#F4F0E7;
  --ink:#1D1B17; --ink-2:#4A453C; --ink-3:#6A6458;
  --line:#DDD6C8; --line-2:#C8BFAE;
  --green:#1E3A2F; --green-2:#2C5243; --green-soft:#DDE6DF;
  --slab:var(--green); --slab-ink:#F3EFE5;
  --walnut:#5A3E2B; --brass:#B08A3E;
  --night:#0B1A14; --night-2:#13291F; --brass-soft:#EFE3C8;
  --white:#F6F3EC; --white-hover:#FFFFFF; --on-white:#13291F;
  --claim:#33507E; --claim-bg:#E5EAF1;
  --evidence:#2C5243; --evidence-bg:#E0EAE3;
  --limit:#86601F; --limit-bg:#F2E9D7;
  --font-head:"Newsreader", "Hahmlet", serif;
  --font-mark:"General Sans", "Pretendard Variable", sans-serif;
  --font-display:"Hahmlet", serif;
  --font-ui:"Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-in-out:cubic-bezier(.65,0,.35,1);
}
*{box-sizing:border-box}
html{background:var(--ground);color:var(--ink);scrollbar-color:var(--line-2) transparent}
body{margin:0;font-family:var(--font-ui);font-size:16px;line-height:1.55;word-break:keep-all;overflow-wrap:break-word;overflow-x:hidden;
  background-color:var(--ground);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:20px 20px;background-attachment:fixed}
::selection{background:var(--brass-soft);color:var(--ink)}
:focus-visible{outline:2px solid var(--green-2);outline-offset:3px;border-radius:4px}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}

/* ===== 위쪽 메뉴 줄 ===== */
.top{position:sticky;top:0;z-index:40;background:rgba(11,26,20,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid rgba(243,239,229,.08)}
.bar{color:var(--slab-ink);height:60px;display:flex;align-items:center;gap:28px;padding:0 2.4vw}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-family:var(--font-mark);font-weight:600;font-size:18px;letter-spacing:-.02em}
.nav{display:flex;gap:26px;margin-right:auto;font-size:15px}
.nav a{text-decoration:none;color:var(--slab-ink);opacity:.92}
.nav a[aria-disabled]{opacity:.45;cursor:default}
.nav a{position:relative;padding:6px 0;transition:opacity .2s}
.nav a::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;border-radius:2px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .25s ease}
.nav a:hover{opacity:1}
.nav a:active{opacity:.7}
.nav a.is-on{opacity:1;font-weight:600}
.nav a.is-on::after{transform:scaleX(1)}
body.is-gl{background:var(--night);background-image:radial-gradient(rgba(243,239,229,.06) 1px,transparent 1.2px)}
.glpage{scroll-margin-top:61px;min-height:calc(100vh - 61px);color:var(--slab-ink);background:radial-gradient(120% 70% at 50% 0%, #24503F 0%, var(--night-2) 45%, var(--night) 100%)}
.glpage__in{max-width:1120px;margin:0 auto;padding:56px 20px 96px}
.glpage__head h1{font-family:var(--font-head);font-weight:400;font-size:clamp(36px,4.4vw,60px);letter-spacing:-.03em;margin:0 0 10px}
.glpage__head p{margin:0 0 26px;max-width:62ch;color:rgba(243,239,229,.72)}
.glpage__search{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:40px}
.glpage__search input{flex:1 1 360px;max-width:560px;height:52px;border-radius:12px;border:1px solid rgba(243,239,229,.22);background:rgba(243,239,229,.07);color:var(--slab-ink);padding:0 18px;font:inherit;font-size:16px}
.glpage__search input::placeholder{color:rgba(243,239,229,.5)}
.glpage__search input:focus{outline:none;border-color:rgba(243,239,229,.55);background:rgba(243,239,229,.1)}
.glpage__count{font-size:13.5px;color:rgba(243,239,229,.6)}
.glpage__sec{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-family:var(--font-ui);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(243,239,229,.62);margin:0 0 14px}
.glpage__sec a{font-weight:500;letter-spacing:0;text-transform:none;color:rgba(243,239,229,.8);text-underline-offset:3px}
.glpage__sec small{font-weight:400;letter-spacing:0;text-transform:none}
.glgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:44px}
.glcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:grid;gap:8px;align-content:start;color:var(--ink);transition:transform .2s var(--ease-out),box-shadow .2s}
.glcard:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.glcard b{font-size:17px;font-weight:600;color:var(--ink)}
.glcard b small{font-weight:400;font-size:13px;color:var(--ink-3);margin-left:6px}
.glcard p{margin:0;font-size:14.5px;color:var(--ink-2)}
.glcard footer{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.glcard .guess{border-radius:999px;background:var(--brass-soft);color:var(--walnut);padding:1px 8px;font-size:11.5px}
.glcard footer a{color:var(--green-2);font-weight:600;text-decoration:none}
.glcard footer a:hover{text-decoration:underline;text-underline-offset:3px}
.glcard mark{background:var(--brass-soft);color:inherit;border-radius:3px;padding:0 1px}
.glvia{margin:-6px 0 12px;font-size:13px;color:rgba(243,239,229,.62)}
.glnote{grid-column:1/-1;margin:0;padding:18px 0;color:rgba(243,239,229,.6);font-size:14.5px}
@media (max-width:760px){.glgrid{grid-template-columns:1fr}.glpage__in{padding-top:36px}}
.mytabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 18px}
.mytabs a{position:relative;display:grid;gap:4px;padding:18px 20px;border-radius:14px;text-decoration:none;color:var(--slab-ink);background:rgba(243,239,229,.06);border:1px solid rgba(243,239,229,.14);transition:background .2s,border-color .2s,transform .2s var(--ease-out)}
.mytabs a:hover{background:rgba(243,239,229,.1)}
.mytabs a:active{transform:translateY(1px)}
.mytabs b{font-size:17px;font-weight:600}
.mytabs span{font-size:13.5px;color:rgba(243,239,229,.66)}
.mytabs em{position:absolute;right:16px;top:16px;font-style:normal;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;background:rgba(243,239,229,.14)}
.mytabs a.is-on{background:var(--surface);border-color:var(--surface);color:var(--ink)}
.mytabs a.is-on span{color:var(--ink-3)}
.mytabs em:empty{display:none}
.mytabs a.is-on em{background:var(--green-soft);color:var(--green)}
.mypanel{background:var(--surface);color:var(--ink);border-radius:16px;padding:24px}
.mypanel__lede{margin:0 0 16px;color:var(--ink-2);font-size:14.5px}
.mypanel .lib-form{max-width:none;background:transparent;padding:0;box-shadow:none}
@media (max-width:760px){.mytabs{grid-template-columns:1fr}.mytabs span{display:none}.mytabs a{padding:14px 16px}.mypanel{padding:18px}}
.wall-nav{position:absolute;left:0;right:0;top:calc(61px + 33vw);height:0;z-index:8;pointer-events:none}
.wall-arrow{pointer-events:auto;position:absolute;top:0;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:1px solid rgba(243,239,229,.28);background:rgba(11,26,20,.55);color:var(--slab-ink);display:grid;place-items:center;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .2s,transform .2s var(--ease-out),opacity .2s}
.wall-arrow:hover{background:rgba(243,239,229,.16)}
.wall-arrow:active{transform:translateY(-50%) scale(.94)}
.wall-arrow--l{left:max(16px,2.4vw)} .wall-arrow--r{right:max(16px,2.4vw)}
.flag-row{margin:10px 0 0}
.flag{border:1px solid var(--line-2);background:transparent;color:var(--ink-2);border-radius:6px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
.flag:hover{border-color:var(--limit);color:var(--limit)}
@media (max-width:760px){.wall-arrow{width:42px;height:42px}}
.my-save{margin-top:16px}
.my-save [hidden]{display:none!important}
.my-save .btn{height:42px;padding:0 18px;font-size:14.5px;cursor:pointer}
.my-save__form{background:var(--surface);border-radius:12px;padding:18px;display:grid;gap:12px;max-width:560px}
.my-save__form label{display:grid;gap:6px;font-size:13.5px;color:var(--ink-2)}
.my-save__form input{height:42px;border-radius:10px;border:1px solid var(--line-2);background:var(--ground);padding:0 12px;font:inherit;font-size:15px;color:var(--ink)}
.my-save__lede{margin:0;font-size:13.5px;color:var(--ink-3)}
.my-save__row{display:flex;gap:10px}
.nav small{font-size:11px;margin-left:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:6px;text-decoration:none;font-weight:500;white-space:nowrap;
  transition:background 160ms var(--ease-out),transform 160ms var(--ease-out),box-shadow 160ms}
.btn:active{transform:translateY(1px)}
.bar .btn{height:38px;padding:0 16px;font-size:14.5px}
.btn--line{background:rgba(243,239,229,.06);color:var(--slab-ink);box-shadow:inset 0 0 0 1px rgba(243,239,229,.28)}
.btn--line:hover{background:rgba(243,239,229,.14)}
.btn--green{background:var(--green);color:var(--slab-ink)}
.btn--green:hover{background:var(--green-2)}
.btn--primary{background:var(--white);color:var(--on-white);font-weight:600}
.btn--primary:hover{background:var(--white-hover)}
.up .btn--primary,.head .btn--primary{background:var(--surface);border:1px solid var(--line-2);color:var(--ink)}
.btn--white{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(60,45,25,.10)}
.btn--white:hover{box-shadow:0 2px 8px rgba(0,0,0,.10)}

/* ===== 첫 화면 ===== */
.hero{position:relative;height:max(760px,70vw);max-height:1120px;margin-top:-61px;padding-top:61px;overflow:hidden;color:var(--slab-ink);
  background:radial-gradient(120% 90% at 50% 100%, #24503F 0%, var(--night-2) 45%, var(--night) 100%)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:clamp(240px,24vw,380px);background:radial-gradient(var(--dot) 1px,transparent 1.2px) 0 0/20px 20px fixed,linear-gradient(to bottom,rgba(236,231,220,0) 0%,rgba(236,231,220,0.02) 14%,rgba(236,231,220,0.07) 26%,rgba(236,231,220,0.16) 38%,rgba(236,231,220,0.3) 50%,rgba(236,231,220,0.46) 61%,rgba(236,231,220,0.63) 72%,rgba(236,231,220,0.79) 82%,rgba(236,231,220,0.92) 91%,rgba(236,231,220,1) 100%);z-index:6;pointer-events:none}
.globe{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:.85}
.hero::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(60% 45% at 50% 30%,rgba(11,26,20,.75),transparent 70%)}
.headline{position:absolute;left:0;right:0;top:calc(61px + 4.6vw);margin:0;text-align:center;z-index:5;pointer-events:none;
  font-family:var(--font-mark);font-weight:600;font-size:clamp(52px,8.2vw,132px);line-height:.92;letter-spacing:-.055em;}
.wall{position:absolute;left:0;right:0;top:calc(61px + 33vw);height:0;z-index:4}
.slot{position:absolute;left:50%;top:0;width:var(--w);height:var(--h);border:0;padding:0;background:var(--c);color:#fff;border-radius:3px;overflow:hidden;text-align:left;
  transform:translate(-50%,-50%) translateX(0) perspective(900px) rotateY(0deg) scale(.22);opacity:0;
  transition:transform 520ms var(--ease-in-out),opacity 300ms,filter 300ms,box-shadow 300ms;
  box-shadow:0 18px 40px -18px rgba(0,0,0,.6)}
.wall.is-open .slot{opacity:1;transform:translate(-50%,-50%) translateX(var(--x)) perspective(900px) rotateY(var(--ry)) scale(1);
  transition:transform 1500ms var(--ease-out) var(--d),opacity 500ms var(--ease-out) var(--d),filter 300ms,box-shadow 300ms}
.wall.is-open.is-settled .slot{--spin:900ms cubic-bezier(.22,.61,.36,1);transition:transform var(--spin),width var(--spin),height var(--spin),filter 300ms,box-shadow 300ms}
.wall.is-open.is-settled .slot .cv__title,.wall.is-open.is-settled .slot .cv__year{transition:font-size 900ms cubic-bezier(.22,.61,.36,1)}
.wall.is-open .slot.is-off{pointer-events:none}
.wall .slot.no-tr,.wall .slot.no-tr .cv__title,.wall .slot.no-tr .cv__year{transition:none!important}
.wall.is-open .slot:hover{transform:translate(-50%,-50%) translateX(var(--x)) perspective(900px) rotateY(var(--ry)) scale(1.04)}
.wall.has-pick .slot:not([aria-pressed="true"]){filter:saturate(.5) brightness(.8)}
.slot[aria-pressed="true"]{box-shadow:0 0 0 3px var(--white),0 24px 48px -20px rgba(0,0,0,.6)}
/* 표지 안 */
.cv{position:absolute;inset:0;display:flex;flex-direction:column;padding:9% 10%}
.cv__org{font-size:clamp(7px,.62vw,11px);font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.cv__title{font-family:var(--font-display);font-weight:300;font-size:calc(var(--w) * var(--tf, .1));line-height:1.15;margin-top:10%;max-width:13ch;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--tl, 6);overflow:hidden}
.cv__year{margin-top:auto;font-family:var(--font-head);font-size:calc(var(--w) * .2);line-height:.9;letter-spacing:-.03em}
.cv__art{position:absolute;inset:0;pointer-events:none}
.cv__tag:empty{display:none}
.cv__tag{position:absolute;right:6%;bottom:4%;font-size:9px;font-weight:600;background:rgba(255,255,255,.2);padding:1px 5px;border-radius:3px}

.lede{position:absolute;left:0;right:0;top:calc(61px + 4.6vw + clamp(52px,8.2vw,132px) + 14px);text-align:center;margin:0;font-size:clamp(13px,1.1vw,17px);line-height:1.55;color:rgba(243,239,229,.74);padding:0 16px;z-index:5;pointer-events:none}
.cta{position:absolute;left:0;right:0;top:calc(61px + 47vw);z-index:7;display:flex;justify-content:center;gap:14px;padding:0 16px}
.cta .btn{height:clamp(46px,3.6vw,58px);padding:0 clamp(20px,1.9vw,30px);font-size:clamp(15px,1.1vw,18px)}

/* ===== 보고서 작업 영역 ===== */
.work{max-width:1120px;margin:0 auto;padding:24px 20px 80px;scroll-margin-top:110px}
.work[hidden]{display:none}
.head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--surface);border-radius:12px;padding:18px 20px}
.head__txt{flex:1;min-width:220px}
.head__org{font-size:12.5px;color:var(--ink-3)}
.head__title{font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1.3;margin:2px 0 8px}
.head__meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-3)}
.head .btn{height:40px;padding:0 15px;font-size:14px;border:1px solid var(--line-2)}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:5px;font-size:12px;font-weight:500}
.badge--reviewed{background:var(--slab);color:#fff}
.badge--auto{border:1px dashed var(--line-2);color:var(--ink-2)}
.cite{margin:14px 2px 0;font-size:12.5px;color:var(--ink-3)}
.badge--fake{background:var(--brass-soft);color:#5E4A1E}
.tabs{display:flex;gap:4px;margin:22px 0 14px;border-bottom:1px solid var(--line-2);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-size:15px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--green);font-weight:600}
.tabs button[aria-disabled="true"]{cursor:default;color:#9A9DA3}
.tabs small{font-size:11px;margin-left:5px;font-weight:400}
.pane{animation:in 380ms var(--ease-out)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.digest{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-radius:12px;overflow:hidden}
.digest section{padding:16px 18px 18px;border-left:1px solid var(--line)}
.digest section:first-child{border-left:0}
.digest h3{margin:0 0 12px}
.digest ol{list-style:none;margin:0;padding:0;display:grid;gap:16px}
.digest li{font-size:15px;line-height:1.55}
.row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600}
.chip--claim{color:var(--claim);background:var(--claim-bg)}
.chip--evidence{color:var(--evidence);background:var(--evidence-bg)}
.chip--limit{color:var(--limit);background:var(--limit-bg)}
.pg,.data{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:5px;font-size:12.5px;font-weight:500;border:1px solid var(--line-2);background:var(--surface)}
.pg:hover{border-color:var(--ink-3)}
.pg[aria-expanded="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.pg .ok{color:var(--evidence)} .pg .miss{color:var(--limit)}
.pg[aria-expanded="true"] span{color:inherit}
.data{background:var(--evidence-bg);color:var(--evidence);border-color:transparent;font-weight:600}
.data:hover,.data[aria-expanded="true"]{border-color:var(--evidence)}
.term{border:0;background:none;padding:0;border-bottom:1px dashed var(--claim);font:inherit;color:inherit}
.pop{margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:13.5px;color:var(--ink-2);animation:in 260ms var(--ease-out)}
.pop b{color:var(--ink);font-weight:600}
.check{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:12px}
.check li{display:flex;justify-content:space-between;gap:16px;padding:14px 18px;border-top:1px solid var(--line);align-items:center}
.check li:first-child{border-top:0}
.verdict{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:5px;white-space:nowrap}
.verdict--yes{background:var(--evidence-bg);color:var(--evidence)}
.verdict--no{background:var(--limit-bg);color:var(--limit)}
.verdict--hard{background:var(--surface-2);color:var(--ink-2)}

/* ===== 내 PDF ===== */
.up{max-width:1120px;margin:0 auto;padding:0 20px 96px;scroll-margin-top:110px}
.up h2{font-family:var(--font-head);font-weight:400;font-size:clamp(30px,3vw,44px);letter-spacing:-.03em;margin:0 0 14px}
.drop{position:relative;display:block;border:1.5px dashed var(--line-2);border-radius:12px;background:var(--surface);padding:30px 20px;text-align:center;cursor:pointer}
.drop.is-over,.drop:hover{border-color:var(--ink-3)}
.drop p{margin:8px 0 14px;font-size:15px}
.drop .btn{height:42px;padding:0 18px}
.drop small{display:block;margin-top:12px;color:var(--ink-3);font-size:12.5px}
.shelfbar{position:absolute;left:0;right:0;top:calc(61px + 4.6vw + clamp(52px,8.2vw,132px) + 28px);z-index:8;display:grid;justify-items:center;gap:10px;padding:0 16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chips button{border:0;border-radius:999px;padding:7px 13px;font-size:13.5px;background:rgba(243,239,229,.08);color:rgba(243,239,229,.82);box-shadow:inset 0 0 0 1px rgba(243,239,229,.18)}
.chips button:hover{background:rgba(243,239,229,.14)}
.chips button[aria-pressed="true"]{background:var(--white);color:var(--on-white);box-shadow:none;font-weight:600}
.shelf-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.shelf-tools select,.shelf-tools input{font:inherit;font-size:13.5px;height:34px;border-radius:8px;border:1px solid rgba(243,239,229,.22);background:rgba(11,26,20,.55);color:var(--slab-ink);padding:0 10px}
.shelf-tools input{width:min(260px,60vw)} .shelf-tools input::placeholder{color:rgba(243,239,229,.5)}
#shelf-empty{margin:4px 0 0;font-size:14px;color:rgba(243,239,229,.8)}
.pending{background:var(--surface);border-radius:12px;padding:22px;display:grid;gap:12px;justify-items:start}
.pending p{margin:0;color:var(--ink-2)}
.sub-h{font-family:var(--font-head);font-weight:400;font-size:26px;letter-spacing:-.02em;margin:36px 0 8px}
#tracker .rq-form{max-width:720px}
.basis--sub{background:#EDEEEF;color:var(--ink-2)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.lib-card{position:relative;aspect-ratio:1/1.414;border-radius:4px;background:var(--c);color:#fff;padding:12px;display:flex;flex-direction:column;gap:6px;box-shadow:0 12px 28px -14px rgba(0,0,0,.5);text-decoration:none}
.lib-card small{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.lib-card b{font-family:var(--font-display);font-weight:400;font-size:14.5px;line-height:1.3}
.lib-card .lib-x{position:absolute;right:6px;bottom:6px;border:0;border-radius:6px;background:rgba(255,255,255,.2);color:#fff;font-size:12px;padding:3px 8px}
.lib-card .lib-x:hover{background:rgba(255,255,255,.35)}
.lib-card--sum{cursor:pointer}
.lib-tag{margin-top:auto;align-self:flex-start;font-size:11px;border-radius:999px;background:rgba(255,255,255,.18);padding:2px 8px;margin-bottom:24px}
.lib-close{height:32px;padding:0 12px;font-size:13px;cursor:pointer;margin-left:6px}
.my-save__check{display:flex!important;flex-direction:row;align-items:center;gap:8px;color:var(--ink)!important}
.my-save__check input{width:18px;height:18px!important;accent-color:var(--green)}
.lib-empty{grid-column:1/-1;color:var(--ink-3);font-size:14px;padding:18px;border:1px dashed var(--line-2);border-radius:12px;text-align:center}
.lib-form{max-width:720px} .lib-form b{font-size:15px}
.tr-box{background:var(--surface);border-radius:12px;padding:20px}
.tr-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;margin-bottom:8px}
.tr-head b{font-size:17px}
.tr-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.tr-legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--c);vertical-align:middle;margin-right:6px}
.tr-legend i.dash{border-top-style:dashed}
#tr-chart svg{width:100%;height:auto;display:block}
#tr-chart .pt{cursor:pointer} #tr-chart .pt:hover circle,#tr-chart .pt:focus circle{r:7}
.tr-detail{min-height:44px;margin:6px 0 10px;font-size:14px;color:var(--ink-2)}
.tr-detail b{color:var(--ink)}
.tr-table{width:100%;border-collapse:collapse;font-size:13.5px}
@media (max-width:560px){.tr-table{display:block;overflow-x:auto;white-space:nowrap}}
.tr-table th,.tr-table td{text-align:left;padding:8px 10px;border-top:1px solid var(--line)}
.tr-table th{font-size:12.5px;color:var(--ink-3);font-weight:600}
.basis{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap}
.basis--source{background:var(--evidence-bg);color:var(--evidence)} .basis--press{background:var(--limit-bg);color:var(--limit)}
.tr-note{margin:12px 0 0;font-size:12.5px;color:var(--ink-3)}
.fc-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.fc-chip{border:1px solid var(--line-2);background:var(--surface-2);border-radius:999px;padding:4px 11px;font-size:12.5px}
.fc-chip:hover{border-color:var(--ink-3)}
.rq-lede{margin:-6px 0 18px;color:var(--ink-2)}
.rq{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;align-items:start}
.rq-form{background:var(--surface);border-radius:12px;padding:20px;display:grid;gap:12px}
.rq-form label{display:grid;gap:5px;font-size:13px;color:var(--ink-2)}
.rq-form input,.rq-form select{font:inherit;font-size:15px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;height:42px;padding:0 12px}
.rq-form input:focus,.rq-form select:focus{outline:2px solid var(--green-2);outline-offset:1px}
.rq-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rq-form .btn{height:44px;justify-self:start;padding:0 20px}
.rq-msg{margin:0;font-size:14px;min-height:1.4em}
.rq-msg.ok{color:var(--evidence)} .rq-msg.err{color:#8A2E1F}
.rq-note{color:var(--ink-3);font-size:12.5px}
.rq-list{display:grid;gap:10px}
.rq-card{background:var(--surface);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center}
.rq-card b{font-weight:600;font-size:15px}
.rq-card small{color:var(--ink-3);font-size:12.5px}
.rq-card p{grid-column:1;margin:2px 0 0;font-size:13.5px;color:var(--ink-2)}
.rq-vote{grid-row:1 / span 3;grid-column:2;display:grid;justify-items:center;gap:2px;border:1px solid var(--line-2);background:var(--surface-2);border-radius:10px;padding:8px 12px;min-width:64px}
.rq-vote:hover{border-color:var(--ink-3)} .rq-vote[disabled]{opacity:.6;cursor:default}
.rq-vote strong{font-size:18px} .rq-vote span{font-size:11.5px;color:var(--ink-3)}
.rq-empty{color:var(--ink-3);font-size:14px;padding:16px;border:1px dashed var(--line-2);border-radius:12px;text-align:center}
@media (max-width:760px){.rq{grid-template-columns:1fr}.rq-2{grid-template-columns:1fr}}
.drop input{position:absolute;width:1px;height:1px;opacity:0}

@media (max-width:760px){
  .nav{display:none}
  .bar{gap:10px;padding:0 12px}
  .bar .btn--primary{display:none}
  #lang{margin-left:auto}
  .cv__org{display:none}
  .hero{height:auto;max-height:none;padding-bottom:60px}
    .headline{position:relative;top:auto;padding-top:18px}
  .wall{position:relative;top:auto;height:62vw;margin-top:2vw}
  .wall .slot{top:50%}
  .lede{position:relative;top:auto;margin-top:10px}
  .shelfbar{position:relative;top:auto;margin-top:16px}
  .chips{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;width:100%;padding-bottom:4px}
  .chips button{flex:none}
  .cta{position:relative;top:auto;margin-top:22px;flex-wrap:wrap}
  .digest{grid-template-columns:1fr}
  .digest section{border-left:0;border-top:1px solid var(--line)}
  .digest section:first-child{border-top:0}
}
@media (prefers-reduced-motion:reduce){ .slot,.wall.is-open .slot,.pane,.pop{transition:none!important;animation:none!important} }
</style>
</head>
<body>

<div class="top">
  <header class="bar">
    <a class="logo" href="#">
      <svg width="22" height="16" viewBox="0 0 22 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M1.5 2.5c3-1.2 6.2-1 9.5 1v11c-3.3-2-6.5-2.2-9.5-1v-11Z"/><path d="M20.5 2.5c-3-1.2-6.2-1-9.5 1v11c3.3-2 6.5-2.2 9.5-1v-11Z"/></svg>
      Trade Digest
    </a>
    <nav class="nav">
      <a href="#" data-t="nav.shelf"></a>
      <a href="#tracker" data-t="nav.tracker"></a>
      <a href="#add" data-t="nav.add"></a>
      <a href="#library" data-t="nav.library"></a>
      <a href="#glossary" data-t="nav.glossary"></a>
    </nav>
    <button class="btn btn--line" id="lang" aria-label="Language"></button>
    <a class="btn btn--primary" href="#library/summary"><span data-t="upload"></span></a>
  </header>
</div>

<main>
  <section class="hero">
    <canvas class="globe" id="globe" aria-hidden="true"></canvas>
    <h1 class="headline">Trade Digest</h1>
    <div class="shelfbar" role="search">
      <div class="chips" id="chips"></div>
      <div class="shelf-tools">
        <select id="f-org" aria-label="Institution"></select>
        <input id="f-q" type="search" data-tp="search">
      </div>
      <p id="shelf-empty" hidden data-t="empty"></p>
    </div>
    <div class="wall" id="wall"></div>
    <div class="wall-nav" id="wall-nav" hidden>
      <button type="button" class="wall-arrow wall-arrow--l" id="wall-prev" data-tp="wall.prev" aria-label="prev"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button type="button" class="wall-arrow wall-arrow--r" id="wall-next" data-tp="wall.next" aria-label="next"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="cta">
      <button class="btn btn--primary" id="go" data-t="cta.open"></button>
    </div>
  </section>

  <section class="work" id="work" hidden aria-live="polite"></section>

  <section class="up tracker" id="tracker">
    <h2 data-t="tr.title"></h2>
    <p class="rq-lede" data-t="tr.lede"></p>
    <div class="tr-box">
      <div class="tr-head"><select id="tr-sel" aria-label="indicator"></select><span class="tr-legend" id="tr-legend"></span></div>
      <div id="tr-chart"></div>
      <div class="tr-detail" id="tr-detail" aria-live="polite"></div>
      <table class="tr-table" id="tr-table"></table>
      <p class="tr-note" id="tr-note"></p>
    </div>
  </section>



  <section class="up" id="add">
    <h2 data-t="ad.title"></h2>
    <p class="rq-lede" data-t="ad.lede"></p>
    <form class="rq-form" id="ad-form" novalidate>
      <label><span data-t="ad.f.title"></span><input name="title" maxlength="200" required></label>
      <div class="rq-2">
        <label><span data-t="ad.f.org"></span><select name="org"><option>WTO</option><option>IMF</option><option>OECD</option><option>World Bank</option><option>UNCTAD</option><option>KIEP</option><option>KITA</option><option>KOTRA</option><option value="기타" data-t="rq.etc"></option></select></label>
        <label><span data-t="ad.f.cat"></span><select name="category" id="ad-cat"></select></label>
      </div>
      <div class="rq-2">
        <label><span data-t="ad.f.pub"></span><input name="published" placeholder="2026-10" maxlength="10" required></label>
        <label><span data-t="ad.f.url"></span><input name="url" type="url" maxlength="500" placeholder="https://" required></label>
      </div>
      <button class="btn btn--primary" type="submit" id="ad-send" data-t="ad.send"></button>
      <p class="rq-msg" id="ad-msg" role="status"></p>
      <small class="rq-note" data-t="ad.note"></small>
      <small class="rq-note" data-t="ad.rules"></small>
    </form>
  </section>
</main>

<section class="glpage mypage" id="library" hidden aria-labelledby="my-h">
  <div class="glpage__in">
    <header class="glpage__head">
      <h1 id="my-h" data-t="my.title"></h1>
      <p data-t="my.lede"></p>
    </header>
    <nav class="mytabs" role="tablist" aria-label="내 서재">
      <a role="tab" href="#library" data-tab="list"><b data-t="my.t1"></b><span data-t="my.d1"></span><em id="my-n"></em></a>
      <a role="tab" href="#library/add" data-tab="add"><b data-t="my.t2"></b><span data-t="my.d2"></span></a>
      <a role="tab" href="#library/summary" data-tab="summary"><b data-t="my.t3"></b><span data-t="my.d3"></span></a>
    </nav>
    <div class="mypanel" data-panel="list" role="tabpanel">
    <div class="lib" id="lib-list"></div>
    <div id="lib-view" aria-live="polite"></div>
    </div>
    <div class="mypanel" data-panel="add" role="tabpanel" hidden>
      <p class="mypanel__lede" data-t="my.p2"></p>
    <form class="rq-form lib-form" id="lb-form" novalidate>
      <div class="rq-2">
        <label><span data-t="ad.f.title"></span><input name="title" maxlength="200" required></label>
        <label><span data-t="ad.f.org"></span><input name="org" maxlength="40"></label>
      </div>
      <label><span data-t="ad.f.url"></span><input name="url" type="url" maxlength="500" placeholder="https://" required></label>
      <button class="btn btn--primary" type="submit" id="lb-send" data-t="lb.send"></button>
      <p class="rq-msg" id="lb-msg" role="status"></p>
      <small class="rq-note" data-t="lb.note"></small>
    </form>
    </div>
    <div class="mypanel" id="upload" data-panel="summary" role="tabpanel" hidden>
      <p class="mypanel__lede" data-t="my.p3"></p>
    <label class="drop" id="drop">
      <p id="drop-msg" data-t="up.body"></p>
      <span class="btn btn--green" data-t="up.btn"></span>
      <input type="file" accept="application/pdf" id="file">
      <small data-t="up.note"></small>
    </label>
    <div id="my-result" aria-live="polite"></div>
    </div>
  </div>
</section>

<section class="glpage" id="glossary" hidden aria-labelledby="gl-h">
  <div class="glpage__in">
    <header class="glpage__head">
      <h1 id="gl-h" data-t="gl.title"></h1>
      <p data-t="gl.lede"></p>
      <div class="glpage__search">
        <input id="gl-q" type="search" data-tp="gl.search" aria-label="search" autocomplete="off">
        <span class="glpage__count" id="gl-count" aria-live="polite"></span>
      </div>
    </header>
    <h2 class="glpage__sec" data-t="gl.ours"></h2>
    <div class="glgrid" id="gl-list"></div>
    <div id="gl-ext" aria-live="polite"></div>
  </div>
</section>

let off = 0, ring = false;   // 공용 서가가 11권을 넘으면 표지들이 벽의 곡선을 따라 좌우로 돈다
const VIS = 5;               // 가운데 기준 좌우 5칸씩 = 11칸
function slotFor(rel){
  if (Math.abs(rel) <= VIS) return {...SLOTS[rel + VIS], off: false};
  const e = SLOTS[rel < 0 ? 0 : SLOTS.length - 1], more = Math.abs(rel) - VIS;
  return {x: e.x + Math.sign(rel) * .3 * Math.min(more, 2), h: e.h, ry: e.ry, off: true};   // 화면 밖 대기 자리
}
function placeWall(){
  const vw = innerWidth, k = vw < 760 ? 1.9 : 1, N = REPORTS.length;
  const ORDER = [5,6,4,7,3,8,2,9,1,10,0];
  [...wall.children].forEach((b, i) => {
    let s, rel;
    if (ring){ rel = ((i - off) % N + N) % N; if (rel > N / 2) rel -= N; s = slotFor(rel); }
    else { s = {...SLOTS[ORDER[i]], off: false}; rel = ORDER[i] - VIS; }
    const prev = b.dataset.rel === undefined ? rel : Number(b.dataset.rel);
    const jump = ring && Math.abs(rel - prev) > 1;   // 끝에서 끝으로 도는 표지
    if (jump) b.classList.add("no-tr");
    b.dataset.rel = rel;
    b.classList.toggle("is-off", s.off);
    b.tabIndex = s.off ? -1 : 0;
    b.style.zIndex = String(Math.round(Math.abs(s.x) * 100));
    b.style.setProperty("--x", `${s.x*vw*k*1.1}px`); b.style.setProperty("--w", `${s.h/1.414*vw*k}px`);
    b.style.setProperty("--h", `${s.h*vw*k}px`); b.style.setProperty("--ry", `${s.ry}deg`);
    b.style.setProperty("--d", `${reduce ? 0 : Math.min(Math.abs(rel), 6) * 90}ms`);
    if (jump){ void b.offsetWidth; requestAnimationFrame(() => b.classList.remove("no-tr")); }
  });
  const nav = $("#wall-nav"); if (nav) nav.hidden = !ring;
}
function spin(step){

function fitTitle(el, text){   // 길수록 글자를 줄이고, 줄 수를 넘으면 … 로 자른다

function buildWall(){

    .sort((a,b) => (b.real?1:0)-(a.real?1:0) || b.published.localeCompare(a.published));

const fmtU = (ind, v) => ind.unit === "%" ? `${v}%` : `$${v}`;

const MAX_PDF_PAGES = 150, CHAR_BUDGET = 56000;
const normQ = x => String(x || "").normalize("NFKC").replace(/-\s*\n\s*/g, "").replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, "-").replace(/\s+/g, " ").trim().toLowerCase();
let mySum = null, myBusy = false;
async function summarizePdf(f){
  if (myBusy || !f) return;
  const msg = $("#drop-msg"), out = $("#my-result");
  if (!/\.pdf$/i.test(f.name) && f.type !== "application/pdf"){ msg.textContent = t("notPdf"); return; }
  myBusy = true; out.innerHTML = ""; mySum = null; msg.textContent = t("picked", f.name);
  try {
    if (!window.pdfjsLib) await new Promise((ok, no) => {   // PDF 도구는 필요할 때만 받는다
      const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
      sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const doc = await pdfjsLib.getDocument({data: await f.arrayBuffer()}).promise;   // 파일은 브라우저 안에서만 연다
    if (doc.numPages > MAX_PDF_PAGES){ msg.textContent = t("tooBig", MAX_PDF_PAGES); return; }
    const pages = [];
    for (let i = 1; i <= doc.numPages; i++){
      msg.textContent = t("reading", i, doc.numPages);
      const tc = await (await doc.getPage(i)).getTextContent();
      pages.push({p: String(i), text: tc.items.map(x => x.str + (x.hasEOL ? "\n" : " ")).join("")});
    }
    if (pages.reduce((a, x) => a + x.text.trim().length, 0) < 200){ msg.textContent = t("noText"); return; }
    msg.textContent = t("summarizing");
    const per = Math.max(300, Math.floor(CHAR_BUDGET / pages.length));   // 긴 보고서는 쪽마다 앞부분만 보낸다
    const sent = pages.map(x => ({p: x.p, text: x.text.replace(/\s+/g, " ").trim().slice(0, per)})).filter(x => x.text);
    const r = await fetch("/api/summarize", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({pages: sent})});
    const j = await r.json().catch(() => ({}));
    if (r.status === 413){ msg.textContent = t("tooBig", MAX_PDF_PAGES); return; }
    if (j.error === "no_key"){ msg.textContent = t("noKey"); return; }
    if (j.error === "no_text"){ msg.textContent = t("noText"); return; }
    if (!r.ok || !j.ok) throw new Error("api");
    const byPage = Object.fromEntries(pages.map(x => [x.p, normQ(x.text)]));
    j.items.forEach(it => {   // 근거 구절 대조: 끝 문장부호는 빼고, 적힌 쪽에 없으면 다른 쪽도 찾아 쪽수를 바로잡는다
      const q = normQ(it.quote).replace(/[.,;:!?…]+$/, "").trim();
      it.found = false; if (q.length < 12) return;
      if (byPage[it.page] && byPage[it.page].includes(q)) { it.found = true; return; }
      const hit = Object.keys(byPage).find(k => byPage[k].includes(q));
      if (hit) { it.page = hit; it.found = true; }
    });
    mySum = {name: f.name, ...j}; msg.textContent = f.name; drawMySum();
  } catch(e){ msg.textContent = t("sumFail"); }
  finally { myBusy = false; file.value = ""; }
}

  const col = role => `<section><h3><span class="chip chip--${role}">${t(role)}</span></h3><ol>${mySum.items.filter(i => i.role === role).map(i =>

function withSubs(ind){
  const series = ind.series.map(s => ({...s, points:[...s.points]}));
  SUBS.filter(x => x.indicator_id === ind.id).forEach(x => {
    let s = series.find(q => q.org === x.org && q.def === x.basis);

function drawTracker(){
  const ind0 = FC.indicators[curInd]; if (!ind0) return; const ind = withSubs(ind0);
  $("#tr-sel").innerHTML = FC.indicators.map((x,i) => `<option value="${i}" ${i===curInd?"selected":""}>${x[lang]}</option>`).join("");
  $("#tr-legend").innerHTML = ind.series.map(s => `<span><i class="${s.def==="goods"?"":"dash"}" style="--c:${ORG_C[s.org]||"#555"}"></i>${s.org}</span>`).join("") + `<span>${t("solid")} · ${t("dashed")}</span>`;
  const all = ind.series.flatMap(s => s.points); const vals = all.map(p => p.value).concat(ind.actual ? [ind.actual.value] : []);
  const toT = d => { const [y,m,dd] = d.split("-").map(Number); return y*12 + (m-1) + ((dd||15)-1)/30; };
  const ts = all.map(p => toT(p.date)); const t0 = Math.min(...ts) - 1, t1 = Math.max(...ts) + 1;
  const vMin = Math.min(0, ...vals), vMax = Math.ceil(Math.max(...vals) + .5);
  const W = 720, H = 300, L = 44, Rr = 16, T = 16, B = 34;
  const x = tt => L + (tt - t0) / (t1 - t0) * (W - L - Rr), y = v => T + (vMax - v) / (vMax - vMin) * (H - T - B);
  let g = "";
  const stp = (vMax - vMin) > 20 ? 10 : 1; for (let v = Math.ceil(vMin / stp) * stp; v <= vMax; v += stp) g += `<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" /><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${fmtU(ind, v)}</text>`;
  for (let tt = Math.ceil(t0); tt <= t1; tt += 3){ const yy = Math.floor(tt/12), mm = tt%12+1; g += `<text x="${x(tt)}" y="${H-12}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${yy}.${String(mm).padStart(2,"0")}</text>`; }
  if (ind.actual) g += `<line x1="${L}" x2="${W-Rr}" y1="${y(ind.actual.value)}" y2="${y(ind.actual.value)}" stroke="var(--ink-3)" stroke-dasharray="2 4"/><text x="${W-Rr}" y="${y(ind.actual.value)-6}" text-anchor="end" font-size="11" fill="var(--ink-3)">${t("actual")} 2025 ${ind.actual.value}%</text>`;
  ind.series.forEach((s, si) => {
    const c = ORG_C[s.org] || "#555", pts = s.points.map(p => [x(toT(p.date)), y(p.value)]);
    if (pts.length > 1) g += `<polyline fill="none" stroke="${c}" stroke-width="2" ${s.def==="goods"?"":'stroke-dasharray="6 5"'} points="${pts.map(q=>q.join(",")).join(" ")}"/>`;
    s.points.forEach((p, pi) => { const key = `${ind.id}|${si}|${pi}`, on = key === trKey;
      g += `<g class="pt" tabindex="0" role="button" data-key="${key}" aria-label="${s.org} ${p.date} ${fmtU(ind, p.value)}"><circle cx="${pts[pi][0]}" cy="${pts[pi][1]}" r="${on?7:5}" fill="${p.basis==="source"?c:"var(--surface)"}" stroke="${c}" stroke-width="2" ${p.basis==="sub"?'stroke-dasharray="2 2"':""}/>
        <text x="${pts[pi][0]}" y="${pts[pi][1]-11}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">${p.value}</text></g>`; });
  });
  $("#tr-chart").innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${ind[lang]}">${g}</svg>`;
  const rows = ind.series.flatMap((s, si) => s.points.map((p, pi) => ({s, p, key:`${ind.id}|${si}|${pi}`}))).sort((a,b) => a.p.date.localeCompare(b.p.date));
  const basis = p => p.basis==="source" ? `<span class="basis basis--source">p. ${p.page}</span>` : p.basis==="sub" ? `<span class="basis basis--sub">${t("basisSub")}</span>` : `<span class="basis basis--press">${t("basisPress")}</span>`;
  $("#tr-table").innerHTML = `<tr><th>${t("trDate")}</th><th>${t("trOrg")}</th><th>${t("trVal")}</th><th>${t("trDef")}</th><th>${t("trBasis")}</th></tr>` +
    rows.map(r => `<tr data-key="${r.key}" style="cursor:pointer"><td>${r.p.date}</td><td>${r.s.org}</td><td><b>${fmtU(ind, r.p.value)}</b></td><td>${r.s["def_"+lang]}</td><td>${basis(r.p)}</td></tr>`).join("");
  const sel = rows.find(r => r.key === trKey);
  $("#tr-detail").innerHTML = sel ? `<b>${sel.s.org} · ${sel.p.date} · ${fmtU(ind, sel.p.value)}</b> (${sel.s["def_"+lang]}) — ${lang==="ko"?(sel.p.note_ko||""):""}
     ${sel.p.quote?`<br>“${sel.p.quote}” (p. ${sel.p.page})`:""}
     ${sel.p.report?` <button class="fc-chip" data-open="${sel.p.report}">${t("openRep")}</button>`:sel.p.source?` <a class="fc-chip" href="${sel.p.source}" target="_blank" rel="noopener">${t("openSrc")} ↗</a>`:""}` : "";
  $("#tr-note").textContent = lang==="ko" ? (ind.missing_ko || "") : "";
}

  chips.innerHTML = [{id:"all", ko:t("all"), en:t("all")}, ...CAT.categories].map(c => `<button data-cat="${c.id}" aria-pressed="${fCat===c.id}">${c[lang]}</button>`).join("");
  const orgs = [...new Set(ALL.flatMap(r => r.org.split(" · ")))].sort();
  fOrgSel.innerHTML = `<option value="all">${t("allOrg")}</option>` + orgs.map(o => `<option ${fOrg===o?"selected":""}>${o}</option>`).join("");
  fQIn.placeholder = t("search");
  document.querySelectorAll("[data-tp]").forEach(el => { const v = t(el.dataset.tp); if (el.tagName === "INPUT") el.placeholder = v; else { el.setAttribute("aria-label", v); el.title = v; } });
}
function refilter(){ off = 0; pick = null; work.hidden = true; wall.classList.remove("has-pick","is-open","is-settled"); buildWall(); unfold(); }
chips.addEventListener("click", e => { const b = e.target.closest("[data-cat]"); if (!b) return; fCat = b.dataset.cat; drawFilters(); refilter(); });
fOrgSel.addEventListener("change", () => { fOrg = fOrgSel.value; refilter(); });
let qT; fQIn.addEventListener("input", () => { clearTimeout(qT); qT = setTimeout(() => { fQ = fQIn.value.trim(); refilter(); }, 250); });

/* ---------- 용어 사전 (독립 페이지) ---------- */
const GL = () => (window.TD_GLOSSARY && window.TD_GLOSSARY.terms) || [];
const glQ = () => ($("#gl-q").value || "").trim();
const hl = (v, q) => { const e = escH(v); if (!q || isJamo(q)) return e; const k = escH(q).toLowerCase(), i = e.toLowerCase().indexOf(k); return i < 0 ? e : e.slice(0, i) + "<mark>" + e.slice(i, i + k.length) + "</mark>" + e.slice(i + k.length); };
const srcLink = u => u ? `<a href="${escH(u)}" target="_blank" rel="noopener" title="${escH(u)}">[${t("gl.src")}]</a>` : "";
const repUrl = id => { const r = ALL.find(x => x.id === id); return r ? r.url : ""; };
const guessTag = x => x.guess ? `<span class="guess">${t("gl.guess")}</span>` : "";
const repName = id => { const r = ALL.find(x => x.id === id); return r ? r[lang] : id; };
const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const cho = v => [...v].map(c => { const k = c.charCodeAt(0) - 0xAC00; return k >= 0 && k < 11172 ? CHO[Math.floor(k / 588)] : c; }).join("");
const isJamo = v => /^[ㄱ-ㅎ\s]+$/.test(v);
function glLocal(){
  const q = glQ().toLowerCase(), nq = q.replace(/\s/g, "");
  if (!q) return GL();
  if (isJamo(q)) return GL().filter(x => cho(x.ko).replace(/\s/g, "").includes(nq));   // 초성 검색: ㄱㅅㅅㅈ → 경상수지
  return GL().filter(x => { const h = (x.ko + " " + x.en + " " + x.def_ko + " " + x.def_en).toLowerCase(); return h.includes(q) || h.replace(/\s/g, "").includes(nq); });
}
function drawGlossary(){
  const q = glQ(), list = glLocal();
  $("#gl-count").textContent = q ? t("gl.found", list.length, GL().length) : t("gl.total", GL().length);
  $("#gl-list").innerHTML = list.map(x => `<article class="glcard"><b>${hl(x[lang === "ko" ? "ko" : "en"], q)}<small>${hl(lang === "ko" ? x.en : x.ko, q)}</small></b>
    <p>${hl(x["def_" + lang], q)}</p>
    <footer>${srcLink(repUrl(x.src.report))}</footer></article>`).join("")
    || `<p class="glnote">${t("gl.noneOurs", q)}</p>`;
  drawExt();
}
let extQ = "", extRes = null, extBusy = false, extT;
function drawExt(){
  const box = $("#gl-ext"), q = glQ();
  if (q.length < 2){ box.innerHTML = `<h2 class="glpage__sec">${t("gl.ext")}</h2><p class="glnote">${t("gl.extHint")}</p>`; return; }
  if (extBusy || extQ !== q){ box.innerHTML = `<h2 class="glpage__sec">${t("gl.ext")}</h2><p class="glnote">${t("gl.extLoading")}</p>`; return; }
  const sec = (name, link, rows, mkCard, noneMsg) => `<h2 class="glpage__sec">${name} <a href="${link}" target="_blank" rel="noopener">${t("gl.open")} ↗</a></h2>
    <div class="glgrid">${rows === null ? `<p class="glnote">${t("gl.extFail")}</p>` : rows.length ? rows.map(mkCard).join("") : `<p class="glnote">${noneMsg}</p>`}</div>`;
  const via = extRes.via && (extRes.via.ko.length || extRes.via.en.length) ? `<p class="glvia">${t("gl.via", [...extRes.via.ko, ...extRes.via.en].join(", "))}</p>` : "";
  box.innerHTML = via +
    sec(t("gl.bok"), "https://ecos.bok.or.kr/", extRes.bok, x => `<article class="glcard"><b>${hl(x.word, q)}</b><p>${escH(x.def)}</p><footer>${srcLink("https://ecos.bok.or.kr/")}${guessTag(x)}</footer></article>`, t("gl.extNone", q)) +
    sec(t("gl.wto"), "https://www.wto.org/english/thewto_e/glossary_e/glossary_e.htm", extRes.wto, x => `<article class="glcard"><b>${hl(x.word, extRes.wtoQ)}</b><p lang="en">${escH(x.def)}</p><footer>${srcLink(x.url)}${guessTag(x)}</footer></article>`, t("gl.wtoNone", extRes.wtoQ));
}
async function fetchExt(){
  const q = glQ(); if (q.length < 2){ drawExt(); return; }
  const local = GL().find(x => x.ko.toLowerCase().includes(q.toLowerCase()));   // 용어 이름이 맞을 때만 영문명을 WTO에 넘긴다
  const KO_EN = [["반덤핑","anti-dumping"],["비관세","non-tariff"],["관세","tariff"],["덤핑","dumping"],["상계","countervailing"],["보조금","subsid"],["세이프가드","safeguard"],["긴급수입제한","safeguard"],["원산지","origin"],["최혜국","most-favoured"],["내국민","national treatment"],["분쟁","dispute"],["쿼터","quota"],["할당","quota"],["지식재산","intellectual property"],["위생","sanitary"],["기술장벽","technical barriers"],["무역원활화","facilitation"],["정부조달","procurement"],["양허","concession"],["자유무역","free trade"],["지역무역","regional trade"],["서비스","services"],["농업","agricultur"],["수출","export"],["수입","import"],["투자","investment"]];   // WTO 용어집은 영문이라 흔한 무역 용어만 영어로 바꿔 찾는다
  const kw = KO_EN.find(([k]) => q.includes(k));
  const alt = /[a-z]/i.test(q) || isJamo(q) ? "" : (kw ? kw[1] : local ? local.en.replace(/\(.*?\)/g, "").trim() : "");
  extBusy = true; extQ = q; drawExt();
  try{
    const r = await fetch(`/api/terms?q=${encodeURIComponent(q)}${alt ? `&alt=${encodeURIComponent(alt)}` : ""}`);
    const j = await r.json();
    if (q !== glQ()) return;
    extRes = j.ok ? {bok: j.bok, wto: j.wto, via: j.via, wtoQ: alt || q} : {bok: null, wto: null, wtoQ: q};
  }catch(e){ if (q === glQ()) extRes = {bok: null, wto: null, wtoQ: q}; }
  finally{ if (q === glQ()){ extBusy = false; drawExt(); } }
}
$("#gl-q").addEventListener("input", () => { drawGlossary(); clearTimeout(extT); extT = setTimeout(fetchExt, 450); });

/* ---------- 언어 ---------- */
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  $("#lang").textContent = t("lang");
  applyLangWall();
  drawTracker(); drawFilters(); drawAddCats(); drawLib(); drawGlossary();
  renderWork();
}
$("#lang").addEventListener("click", () => { lang = lang === "ko" ? "en" : "ko"; try{ localStorage.setItem("td-lang", lang); }catch(e){} applyLang(); });

/* ---------- 상단 탭 ---------- */
const navLinks = [...document.querySelectorAll(".nav a")];
const glSec = $("#glossary");
let wasGl = false;
const mySec = $("#library");
function route(){
  const h = location.hash;
  const onGl = h === "#glossary", onMy = h === "#library" || h.startsWith("#library/") || h === "#upload";
  const page = onGl || onMy;   // 용어 사전 · 내 서재는 완전히 다른 페이지처럼
  glSec.hidden = !onGl; mySec.hidden = !onMy;
  document.querySelector("main").hidden = page;
  document.body.classList.toggle("is-gl", page);
  if (onMy){
    const tab = h === "#upload" ? "summary" : (h.split("/")[1] || "list");
    mySec.querySelectorAll("[data-tab]").forEach(a => { const on = a.dataset.tab === tab; a.classList.toggle("is-on", on); a.setAttribute("aria-selected", on); });
    mySec.querySelectorAll("[data-panel]").forEach(p => p.hidden = p.dataset.panel !== tab);
  }
  navLinks.forEach(a => { const href = a.getAttribute("href"); a.classList.toggle("is-on", href === h || (href === "#library" && onMy) || (href === "#" && (!h || h === "#"))); });
  if (onGl) drawGlossary();
  if (page && !(onMy && wasMy)){ scrollTo(0, 0); requestAnimationFrame(() => scrollTo(0, 0)); }
  else if (wasGl || wasMy){ const el = h && h !== "#" && /^#[\w-]+$/.test(h) && document.querySelector(h); requestAnimationFrame(() => el ? el.scrollIntoView() : scrollTo(0, 0)); }
  wasGl = onGl; wasMy = onMy;
}
let wasMy = false;
navLinks.forEach(a => a.addEventListener("click", e => {
  const href = a.getAttribute("href");
  if (href === "#"){ e.preventDefault(); history.pushState(null, "", location.pathname + location.search); route(); scrollTo({top: 0, behavior: "smooth"}); }
}));
addEventListener("hashchange", route);
route();

let holdT;   // 화살표: 한 번 누르면 한 칸, 누르고 있으면 쭈루룩
function holdSpin(btn, step){
  const stop = () => clearInterval(holdT);
  btn.addEventListener("pointerdown", e => { e.preventDefault(); spin(step); stop(); holdT = setInterval(() => spin(step), 420); });
  ["pointerup","pointerleave","pointercancel","blur"].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); spin(step); } });
}
holdSpin($("#wall-prev"), -1); holdSpin($("#wall-next"), 1);
let wheelAcc = 0;   // 트랙패드 · 마우스로 옆으로 밀면 민 만큼 돈다
document.querySelector(".hero").addEventListener("wheel", e => {
  if (!ring || Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
  e.preventDefault(); wheelAcc += e.deltaX;
  while (Math.abs(wheelAcc) >= 70){ spin(Math.sign(wheelAcc)); wheelAcc -= Math.sign(wheelAcc) * 70; }
}, {passive: false});
let tx = null;   // 휴대폰: 손가락으로 밀면 민 만큼
wall.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, {passive: true});
wall.addEventListener("touchmove", e => { if (tx === null || !ring) return; const dx = e.touches[0].clientX - tx; if (Math.abs(dx) >= 55){ spin(dx < 0 ? 1 : -1); tx = e.touches[0].clientX; } }, {passive: true});
wall.addEventListener("touchend", () => { tx = null; });
addEventListener("keydown", e => { if (ring && !document.querySelector("main").hidden && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && scrollY < innerHeight * .6){ if (e.key === "ArrowRight") spin(1); if (e.key === "ArrowLeft") spin(-1); } });

buildWall(); applyLang();
setTimeout(unfold, 250);
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { buildWall(); applyLang(); wall.classList.add("is-open","is-settled"); }, 200); });
</script>
<script type="module">
/* 3D 점 지구본 + 교역 항로 (장식용 그림. 항로는 예시이며 교역량을 뜻하지 않음) */
import * as d3 from "https://cdn.jsdelivr.net/npm/d3-geo@3.1.1/+esm";
import * as topojson from "https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/+esm";
const cv = document.getElementById("globe"), ctx = cv.getContext("2d"), hero = cv.parentElement;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const PORTS = { busan:[129.04,35.1], shanghai:[121.5,31.2], singapore:[103.8,1.29], rotterdam:[4.48,51.92], hamburg:[9.99,53.55], la:[-118.26,33.74],
  ny:[-74.0,40.7], santos:[-46.33,-23.96], dubai:[55.03,25.0], mumbai:[72.87,18.95], durban:[31.03,-29.87], sydney:[151.2,-33.86], tokyo:[139.77,35.62], vancouver:[-123.1,49.28] };
const ROUTES = [["busan","rotterdam"],["shanghai","la"],["singapore","hamburg"],["tokyo","vancouver"],["santos","shanghai"],["dubai","mumbai"],["ny","rotterdam"],["durban","singapore"],["sydney","busan"],["la","busan"],["mumbai","rotterdam"],["shanghai","dubai"]];
let W=0,H=0,dpr=1, dots=[], landGeo=null, rot=[-100,-18], t0=performance.now(), running=true;
const proj = d3.geoOrthographic().clipAngle(90), path = d3.geoPath(proj, ctx);
function size(){
  dpr = Math.min(2, devicePixelRatio || 1); W = hero.clientWidth; H = hero.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const r = Math.min(W*0.46, H*0.82); proj.scale(r).translate([W/2, H*0.86]);
}
function land(){
  return fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-110m.json").then(r=>r.json()).then(topo=>{
    const l = topojson.feature(topo, topo.objects.land); landGeo = l; const out=[];
    for (let lat=-58; lat<=78; lat+=0.8){ const step = 0.8/Math.max(.25,Math.cos(lat*Math.PI/180));
      for (let lon=-180; lon<180; lon+=step){ if (d3.geoContains(l,[lon,lat])){ // 물줄기처럼 보이는 짧은 선: 방향은 부드러운 흐름장, 색은 두 가지
        const a = Math.sin(lon*.09)*1.6 + Math.cos(lat*.13)*1.3 + Math.sin((lon+lat)*.05);
        out.push([lon,lat, lon+Math.cos(a)*1.0, lat+Math.sin(a)*0.8, (Math.sin(lon*.31)*Math.cos(lat*.27) > .35) ? 1 : 0]); } } }
    dots = out;
  }).catch(()=>{ dots = []; });
}
const arcs = ROUTES.map(([a,b],i)=>({a:PORTS[a],b:PORTS[b],ip:d3.geoInterpolate(PORTS[a],PORTS[b]),off:i*0.37}));
function frame(now){
  const T = (now - t0)/1000;
  if (!reduce) rot[0] = -100 + T*4;
  proj.rotate(rot);
  ctx.clearRect(0,0,W,H);
  const [cx,cy] = proj.translate(), r = proj.scale();
  // 대륙: 바다는 비우고, 육지를 미세한 점으로 채운다 (가장자리로 갈수록 옅게)
  const lam0 = -rot[0]*Math.PI/180, phi0 = -rot[1]*Math.PI/180, sp0=Math.sin(phi0), cp0=Math.cos(phi0);
  for (const d of dots){
    const lam=d[0]*Math.PI/180, phi=d[1]*Math.PI/180;
    const c = sp0*Math.sin(phi)+cp0*Math.cos(phi)*Math.cos(lam-lam0);
    if (c <= 0.02) continue;
    const p = proj([d[0],d[1]]), z = 0.8 + 0.6*c;
    ctx.fillStyle = `rgba(214,232,222,${0.12+0.5*c})`; ctx.fillRect(p[0]-z/2, p[1]-z/2, z, z);
  }
  // 항로
  ctx.lineCap = "round";
  for (const a of arcs){
    ctx.strokeStyle = "rgba(243,239,229,.08)"; ctx.lineWidth = 1; ctx.beginPath(); path({type:"LineString",coordinates:[a.a,a.b]}); ctx.stroke();
    const k = ((T*0.22 + a.off) % 1.3); const h = Math.min(1,k), tail = Math.max(0,k-0.3);
    if (h > tail){ const pts=[]; for(let i=0;i<=24;i++) pts.push(a.ip(tail+(h-tail)*i/24));
      ctx.strokeStyle = "rgba(243,239,229,.45)"; ctx.lineWidth = 1.2;
      ctx.beginPath(); path({type:"LineString",coordinates:pts}); ctx.stroke(); ctx.shadowBlur = 0; }
    for (const q of [a.a,a.b]){ const lam=q[0]*Math.PI/180, phi=q[1]*Math.PI/180;
      if (sp0*Math.sin(phi)+cp0*Math.cos(phi)*Math.cos(lam-lam0) > 0){ const p=proj(q); ctx.fillStyle="rgba(243,239,229,.5)"; ctx.beginPath(); ctx.arc(p[0],p[1],1.4,0,Math.PI*2); ctx.fill(); } }
  }
  if (running && !reduce) requestAnimationFrame(frame);
}
size(); addEventListener("resize", () => { size(); if (reduce) frame(performance.now()); });
new IntersectionObserver(([e]) => { const was = running; running = e.isIntersecting; if (running && !was && !reduce) requestAnimationFrame(frame); }).observe(hero);
land().then(() => requestAnimationFrame(frame));
requestAnimationFrame(frame);
</script>
