<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Policyline 시안 2 · 제도와 선</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --color-bg:#F5F8FA;
  --color-grid:rgba(30,60,110,.07);
  --color-ink:#16284A;
  --color-ink-soft:#5A6880;
  --color-rule:#C9D3DE;
  --color-line:#E2461D;
  --color-surface:#FFFFFF;
  --color-focus:#1D5FD1;
  --font:"IBM Plex Sans KR", system-ui, sans-serif;
  --s1:8px;--s2:16px;--s3:24px;--s4:32px;--s6:48px;--s8:64px;
}
*{box-sizing:border-box;margin:0}
body{font-family:var(--font);color:var(--color-ink);font-size:16px;line-height:1.6;font-variant-numeric:tabular-nums;word-break:keep-all;
 background-color:var(--color-bg);
 background-image:linear-gradient(var(--color-grid) 1px,transparent 1px),linear-gradient(90deg,var(--color-grid) 1px,transparent 1px);
 background-size:24px 24px}
.draft{background:var(--color-ink);color:var(--color-surface);font-size:13px;padding:var(--s1) var(--s2);text-align:center}
.wrap{max-width:1120px;margin:0 auto;padding:var(--s6) var(--s3) var(--s8)}
.brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:var(--s1)}
.brand i{width:3px;height:22px;background:var(--color-line);display:inline-block}
h1{font-weight:300;font-size:clamp(34px,5.6vw,60px);line-height:1.15;letter-spacing:-.02em;max-width:15em;margin:var(--s6) 0 var(--s2)}
h1 b{font-weight:700}
.sub{color:var(--color-ink-soft);max-width:36em;font-size:18px}
/* timeline hero */
.timeline{position:relative;margin:var(--s6) 0 var(--s8);height:200px;border-bottom:2px solid var(--color-ink)}
.year{position:absolute;bottom:-28px;font-size:13px;color:var(--color-ink-soft);transform:translateX(-50%)}
.tick{position:absolute;bottom:0;width:44px;margin-left:-22px;height:100%;background:none;border:0;cursor:pointer;padding:0;font:inherit;color:inherit}
.tick::before{content:"";position:absolute;left:50%;bottom:0;width:2px;height:var(--h);background:var(--color-line);transform-origin:bottom;transform:scaleY(0);animation:draw .7s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--dl)}
.tick span{position:absolute;left:50%;bottom:calc(var(--h) + 8px);white-space:nowrap;font-size:13px;font-weight:600;transform:translateX(-50%);opacity:0;animation:fade .3s ease-out forwards;animation-delay:calc(var(--dl) + .5s)}
.tick:hover::before{width:4px;margin-left:-1px}
.tick:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}
@keyframes draw{to{transform:scaleY(1)}}
@keyframes fade{to{opacity:1}}
h2{font-size:22px;font-weight:600;margin-bottom:var(--s2)}
.rows{border-top:2px solid var(--color-ink)}
.row{display:grid;grid-template-columns:120px 1fr 260px;gap:var(--s3);align-items:center;padding:var(--s3) var(--s2);border-bottom:1px solid var(--color-rule);text-decoration:none;color:inherit;background:transparent;transition:background-color .15s ease-out}
.row time{font-weight:600;font-size:15px}
.row h3{font-size:20px;font-weight:600;line-height:1.35}
.row p{color:var(--color-ink-soft);font-size:14px;margin-top:4px}
.row .cta{display:inline-block;margin-top:var(--s1);font-size:14px;font-weight:600;color:var(--color-line)}
.row svg{width:100%;height:64px;display:block}
.row small{display:block;font-size:12px;color:var(--color-ink-soft);text-align:right}
.row:hover{background:var(--color-surface)}
.row:hover .cta{text-decoration:underline}
.row:focus-visible{outline:2px solid var(--color-focus);outline-offset:-2px;background:var(--color-surface)}
.row:active{background:var(--color-bg)}
footer{margin-top:var(--s6);font-size:13px;color:var(--color-ink-soft)}
@media (max-width:760px){.row{grid-template-columns:1fr;gap:var(--s1)}.row small{text-align:left}.timeline{height:160px}.tick span{display:none}}
@media (prefers-reduced-motion:reduce){.tick::before{animation:none;transform:none}.tick span{animation:none;opacity:1}.row{transition:none}}
</style>
</head>
<body>
<div class="draft">디자인 시안 2 · 그래프 모양과 숫자는 <b>가상</b>입니다 · 정책 날짜는 원문 확인 전</div>
<div class="wrap">
  <div class="brand"><i></i>Policyline</div>
  <h1>정책이 발표된 날에 <b>선을 긋고</b>, 앞뒤 12개월의 교역을 봅니다</h1>
  <p class="sub">관세·제재·수출통제 5건. 선 하나를 고르면 그 정책의 발표 전후 그래프가 열립니다. 원인은 단정하지 않습니다.</p>
  <div class="timeline" id="tl" aria-label="정책 발표 시점"></div>
  <h2>최근 정책 이슈</h2>
  <div class="rows" id="rows"></div>
  <footer>교역 자료: UN Comtrade 월별 자료 예정 (이 시안의 선은 가상) · 정책 원문 링크는 각 화면에 붙습니다</footer>
</div>
<script>
const P=[
 {t:"EU, 중국산 전기차에 상계관세",d:"2024-07-04",item:"전기 승용차 · HS 8703.80",flow:"중국 → EU 수출",s:[5,6,6,7,7,8,8,9,9,8,9,9,8,7,7,6,6,7,6,6,5,6,6,5,5]},
 {t:"미국, 중국산 전기차 관세 100%",d:"2024-05-14",item:"전기 승용차 · HS 8703.80",flow:"중국 → 미국 수출",s:[3,3,4,3,4,4,3,4,4,3,4,4,3,3,2,2,2,1,1,1,1,1,1,1,1]},
 {t:"중국, 갈륨·게르마늄 수출통제",d:"2023-07-03",item:"갈륨 등 · HS 8112.92",flow:"중국 → 전 세계 수출",s:[6,6,5,6,6,7,6,6,7,7,8,9,6,2,1,2,3,4,4,5,4,4,5,4,4]},
 {t:"미국, 대중국 반도체 장비 수출통제",d:"2022-10-07",item:"반도체 제조장비 · HS 8486",flow:"미국 → 중국 수출",s:[7,8,8,7,8,8,9,8,8,9,8,8,7,6,6,5,5,4,5,4,4,4,3,4,4]},
 {t:"일본, 대한국 수출규제",d:"2019-07-01",item:"불화수소 · HS 2811.11",flow:"일본 → 한국 수출",s:[7,7,6,7,7,7,6,7,7,6,7,7,5,3,2,1,1,1,1,2,1,2,2,2,2]}
];
const t0=Date.parse("2019-01-01"),t1=Date.parse("2025-06-30"),pos=d=>((Date.parse(d)-t0)/(t1-t0)*100);
const tl=document.getElementById("tl");let h="";
for(let y=2019;y<=2025;y++)h+=`<span class="year" style="left:${pos(y+"-01-01")}%">${y}</span>`;
const heights=[78,58,70,64,74];
[...P].reverse().forEach((p,i)=>{const idx=P.indexOf(p);
 h+=`<button class="tick" style="left:${pos(p.d)}%;--h:${heights[idx]}%;--dl:${(i*.12).toFixed(2)}s" aria-label="${p.t}, ${p.d}" onclick="location.hash='policy-${idx+1}'"><span>${p.d.slice(0,7).replace('-','.')}</span></button>`});
tl.innerHTML=h;
function spark(s){const w=260,hh=56,max=Math.max(...s),x=i=>i*w/(s.length-1),y=v=>hh-4-(v/max)*(hh-8);
 return `<svg viewBox="0 0 ${w} ${hh}" preserveAspectRatio="none" aria-hidden="true"><line x1="${x(12)}" y1="0" x2="${x(12)}" y2="${hh}" stroke="var(--color-line)" stroke-width="2" vector-effect="non-scaling-stroke"/><polyline points="${s.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ')}" fill="none" stroke="var(--color-ink)" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`}
document.getElementById("rows").innerHTML=P.map((p,i)=>`
<a class="row" href="#policy-${i+1}">
 <time datetime="${p.d}">${p.d.replaceAll('-','.')}</time>
 <div><h3>${p.t}</h3><p>${p.item} · ${p.flow}</p><span class="cta">발표 전후 보기</span></div>
 <div>${spark(p.s)}<small>전후 12개월 미리보기 · 가상</small></div>
</a>`).join("");
</script>
</body>
</html>
